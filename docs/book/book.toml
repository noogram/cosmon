[book]
title = "noogram / cosmon"
description = "Noogram — the open-source distribution for composing, piloting, and auditing AI missions, built on the Cosmon kernel."
authors = ["Noogram"]
language = "en"
src = "src"

# Output goes to docs/book/book/ (relative to this file). This is the directory
# Cloudflare Pages publishes — see wrangler.toml (pages_build_output_dir).
# NOTE: merging to main does NOT publish — there is intentionally no
# auto-deploy-on-push workflow. Publication rides the TAG instead: the
# `publish-docs` job in .github/workflows/release.yml builds this book, stamps
# the built bundle with the released version, deploys it, and then asserts the
# live origin serves that version (task-20260810-5d79).
# Canonical docs host is docs.noogram.org (delib-20260711-8d00, topology A).
# The apex noogram.org and the noogram.dev→noogram.org 301 are C2's remit
# (domain/DNS), not configured here.
build-dir = "book"

[output.html]
default-theme = "light"
# Light sage is the universal default: a fresh visitor always opens in light,
# even under an OS dark preference. Coal remains one click away via the toggle.
preferred-dark-theme = "light"
git-repository-url = "https://github.com/noogram/cosmon"
edit-url-template = "https://github.com/noogram/cosmon/edit/main/docs/book/{path}"
no-section-label = false
additional-css = ["noogram-charte.css"]
additional-js = [
    "mermaid.min.js",
    "mermaid-init.js",
    "conway.js",
    "page-toc.js",
    # Le surlignage `?highlight=` de mdBook ne s'efface qu'en cliquant sur un
    # <mark> et reste dans l'URL : une phrase un peu longue laisse la page en
    # damier illisible. Cet asset le rend congédiable (clic / Échap /
    # défilement) et nettoie l'URL. Voir l'en-tête du fichier.
    "search-highlight-dismiss.js",
]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
