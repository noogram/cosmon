components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC-issued JWT signed with `RS256` or `ES256` (clause (a)).
        The token's `kid` MUST resolve in the operator's pinned JWKS
        (`<state_dir>/security/jwks/`). `none`, `HS256`, `EdDSA`,
        `RS384`, `RS512` are rejected at parse time.

  schemas:
    StatusEnvelope:
      type: "object"
      required: ["request_id", "molecule_id", "status", "phase", "updated_at", "terminal"]
      properties:
        request_id:
          type: "string"
        molecule_id:
          type: "string"
        status:
          type: "string"
        phase:
          type: "string"
        updated_at:
          type: "string"
          format: "date-time"
        terminal:
          type: "boolean"
    SessionEnvelope:
      type: "object"
      required: ["request_id", "molecule_id", "status", "adapter", "source", "retrospective", "live", "total", "offset", "returned", "truncated", "waiting", "entries"]
      properties:
        request_id:
          type: "string"
        molecule_id:
          type: "string"
        status:
          type: "string"
        adapter:
          anyOf: [{"type": "string"}, {"type": "null"}]
        source:
          type: "string"
          enum: ["claude-transcript", "codex-rollout", "tmux-scrollback", "none"]
        retrospective:
          type: "boolean"
        live:
          type: "boolean"
        total:
          type: "integer"
          minimum: 0
        offset:
          type: "integer"
          minimum: 0
        returned:
          type: "integer"
          minimum: 0
        truncated:
          type: "boolean"
        waiting:
          type: "object"
          required: ["waiting", "class", "evidence", "evidence_source", "awaiting_operator"]
          properties:
            waiting:
              type: "boolean"
            class:
              type: "string"
            evidence:
              anyOf: [{"type": "string"}, {"type": "null"}]
            evidence_source:
              type: "string"
            awaiting_operator:
              type: "boolean"
        entries:
          type: "array"
          items:
            type: "object"
            required: ["ordinal", "at", "origin", "text"]
            properties:
              ordinal:
                type: "integer"
                minimum: 1
              at:
                anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
              origin:
                type: "string"
                enum: ["worker", "operator", "system"]
              text:
                type: "string"
    DoneBody:
      type: "object"
      required: ["reason"]
      properties:
        reason:
          type: "string"
          minLength: 1
          description: "Required non-blank explanation; whitespace-only is missing_reason."
        strategy:
          type: "string"
          enum: ["merge", "ff-only"]
          default: "merge"
        force:
          type: "boolean"
          default: false
        if_completed:
          type: "boolean"
          default: false
        no_merge:
          type: "boolean"
          default: false
        no_worktree_remove:
          type: "boolean"
          default: false
        no_branch_delete:
          type: "boolean"
          default: false
        no_kill:
          type: "boolean"
          default: false
        no_auto_propel:
          type: "boolean"
          default: true
        skip_pre_done_hook:
          type: "boolean"
          default: false
        deploy_off_trunk:
          type: "boolean"
          default: false
        propel_message:
          type: "string"
        max_retries:
          type: "integer"
          minimum: 0
          maximum: 4294967295
          default: 0
      additionalProperties: false
    DoneEnvelope:
      type: "object"
      required: ["request_id", "harvest"]
      properties:
        request_id:
          type: "string"
        harvest:
          type: "object"
          required: ["molecule", "outcome", "merged", "non_integration"]
          properties:
            molecule:
              type: "string"
            outcome:
              type: "string"
              enum: ["landed", "closed_without_merge", "already_landed", "no_op"]
            merged:
              type: "boolean"
            non_integration:
              anyOf: [{"type": "string"}, {"type": "null"}]
    RunEnvelope:
      type: "object"
      required: ["request_id", "drain"]
      properties:
        request_id:
          type: "string"
        drain:
          type: "object"
          required: ["root", "status", "bounds", "timeout_secs", "started_at"]
          properties:
            root:
              type: "string"
            status:
              type: "string"
              enum: ["started"]
            bounds:
              type: "object"
              required: ["budget", "max_depth", "max_molecules"]
              properties:
                budget:
                  type: "integer"
                  minimum: 0
                max_depth:
                  type: "integer"
                  minimum: 0
                max_molecules:
                  type: "integer"
                  minimum: 0
            timeout_secs:
              type: "integer"
              minimum: 0
            started_at:
              type: "string"
              format: "date-time"
    ResultEnvelope:
      type: "object"
      required: ["request_id", "molecule_id", "status", "result_status", "liveness", "integration", "result"]
      properties:
        request_id:
          type: "string"
        molecule_id:
          type: "string"
        status:
          type: "string"
        result_status:
          type: "string"
        liveness:
          type: "object"
          required: ["process", "heartbeat_at", "tackled_at", "stale_after_s"]
          properties:
            process: {}
            heartbeat_at:
              anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
            tackled_at:
              anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
            stale_after_s:
              type: "integer"
              minimum: 0
        integration:
          type: "object"
          required: ["merged_at", "reason", "observed_at", "base_branch", "detail", "retryable"]
          properties:
            merged_at:
              anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
            reason:
              anyOf: [{"type": "string"}, {"type": "null"}]
            observed_at:
              anyOf: [{"type": "string", "format": "date-time"}, {"type": "null"}]
            base_branch:
              anyOf: [{"type": "string"}, {"type": "null"}]
            detail:
              anyOf: [{"type": "string"}, {"type": "null"}]
            retryable:
              anyOf: [{"type": "boolean"}, {"type": "null"}]
        result:
          anyOf: [{"type": "object", "required": ["source", "content_type", "encoding", "content", "size_bytes", "integrity"], "properties": {"source": {"type": "string"}, "content_type": {"type": "string"}, "encoding": {"type": "string", "enum": ["utf8", "base64"]}, "content": {"type": "string"}, "size_bytes": {"type": "integer", "minimum": 0}, "integrity": {"$ref": "#/components/schemas/IntegrityHash"}}}, {"type": "null"}]
    ClaudeAuthError:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message"]
          properties:
            code:
              type: "string"
            message:
              type: "string"
            session_id:
              type: "string"
            current_state:
              type: "string"
    ClaudeAuthSession:
      type: "object"
      required: ["session_id", "state", "created_at", "ttl_at"]
      properties:
        session_id:
          type: "string"
        state:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        ttl_at:
          type: "string"
          format: "date-time"
        verification_url:
          type: "string"
          format: "uri"
        oauth_state:
          type: "string"
        expires_at:
          type: "string"
          format: "date-time"
        account_email:
          type: "string"
        error:
          type: "object"
          required: ["code", "message"]
          properties:
            code:
              type: "string"
            message:
              type: "string"
    NucleateBody:
      type: object
      required: [formula]
      properties:
        formula:
          type: string
          description: Formula name (e.g. `task-work`, `deep-think`).
          minLength: 1
        kind:
          type: string
          description: |
            Molecule kind. Defaults to the formula's own default.
            Common values: `task`, `idea`, `decision`, `issue`,
            `signal`, `deliberation`.
        variables:
          type: object
          additionalProperties:
            type: string
          description: |
            Variables map (string → string). Each entry is rendered
            as `--var key=value` on the cosmon CLI. Non-string
            values are rejected with 400.
        tags:
          type: array
          items:
            type: string
          description: |
            Optional tag list. Values are passed as `--tag <t>`; the
            cosmon Tag parser rejects whitespace and `:` outside
            scheme position. Invalid tags surface as 409.

    TagBody:
      type: object
      description: |
        At least one of `add` / `remove` must be non-empty
        (empty payload → 400).
      properties:
        add:
          type: array
          items:
            type: string
          description: Tags to add.
        remove:
          type: array
          items:
            type: string
          description: Tags to remove.

    CollapseBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Free-form reason (mandatory, non-empty after trim).
        cause:
          type: string
          description: |
            Structured cause attribution. Suggested values:
            `rate_limit`, `design_change`, `abandoned`,
            `dependency_dropped`.
        account:
          type: string
          description: |
            Account alias (only meaningful with `cause = "rate_limit"`).
        kind:
          type: string
          description: |
            Quota currency name (only meaningful with
            `cause = "rate_limit"` — e.g. `anthropic-tokens`).

    FreezeBody:
      type: object
      required: [state]
      additionalProperties: false
      description: |
        Toggle the molecule's frozen status. `state: "frozen"` pauses
        a Running molecule; `state: "active"` resumes a Frozen one.
        `reason` is threaded into the corresponding `MoleculeFrozen`
        or `MoleculeThawed` event for traceability.
      properties:
        state:
          type: string
          enum: [frozen, active]
          description: Target lifecycle status.
        reason:
          type: string
          description: |
            Optional reason recorded against the state transition.

    StuckBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Free-form reason (mandatory, non-empty after trim).

    MoleculeEnvelope:
      type: object
      required: [request_id, molecule]
      properties:
        request_id:
          type: string
          description: |
            Opaque correlation id (BLAKE3 prefix). Used to find the
            audit envelope under
            `.cosmon/whispers/inbox/api/<request_id>.json`.
          example: "01HV9C7XDH"
        molecule:
          $ref: "#/components/schemas/MoleculeView"

    EnsembleEnvelope:
      type: object
      required: [request_id, ensemble]
      properties:
        request_id:
          type: string
        ensemble:
          type: object
          additionalProperties: true
          description: |
            Byte-stable projection of `cs --json ensemble`. Concrete
            shape: `{ molecules: [MoleculeView, ...] }` with the same
            field set as `cs --json ensemble`.

    VitalsEnvelope:
      type: object
      required: [request_id, vitals]
      properties:
        request_id:
          type: string
        vitals:
          $ref: "#/components/schemas/VitalsView"

    VitalsView:
      type: object
      required: [molecules, counts, backlog, observed_at]
      properties:
        molecules:
          type: array
          description: Exactly one row per non-terminal molecule.
          items:
            $ref: "#/components/schemas/VitalsRow"
        counts:
          $ref: "#/components/schemas/VitalsCounts"
        backlog:
          $ref: "#/components/schemas/VitalsBacklog"
        observed_at:
          type: string
          format: date-time

    VitalsRow:
      type: object
      required:
        [id, status, current_step, total_steps, health,
         awaiting_operator, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
        current_step:
          type: integer
          minimum: 0
        total_steps:
          type: integer
          minimum: 0
        worker:
          type: string
        health:
          type: string
          enum: [unassigned, live, orphaned, unknown]
        awaiting_operator:
          type: boolean
          description: True only for the declared `temp:awaiting-op` tag.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VitalsCounts:
      type: object
      required: [molecules, live, orphaned, unknown, unassigned, awaiting_operator]
      properties:
        molecules: { type: integer, minimum: 0 }
        live: { type: integer, minimum: 0 }
        orphaned: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
        unassigned: { type: integer, minimum: 0 }
        awaiting_operator: { type: integer, minimum: 0 }

    VitalsBacklog:
      type: object
      required: [count, stale, oldest_age_seconds, oldest_id, leases_excluded]
      properties:
        count: { type: integer, minimum: 0 }
        stale: { type: integer, minimum: 0 }
        oldest_age_seconds:
          type: [integer, "null"]
          minimum: 0
        oldest_id:
          type: [string, "null"]
        leases_excluded: { type: integer, minimum: 0 }

    TagEnvelope:
      type: object
      required: [request_id, tag]
      properties:
        request_id:
          type: string
        tag:
          type: object
          additionalProperties: true
          description: |
            Byte-stable projection of `cs --json tag <id>`. Carries
            the resulting tag set after add/remove.

    CollapseEnvelope:
      type: object
      required: [request_id, collapse]
      properties:
        request_id:
          type: string
        collapse:
          type: object
          additionalProperties: true
          description: |
            Byte-stable projection of `cs --json collapse`. Carries
            the post-collapse status + emitted event reference.

    FreezeEnvelope:
      type: object
      required: [request_id, freeze]
      properties:
        request_id:
          type: string
        freeze:
          type: object
          additionalProperties: true
          description: |
            Byte-stable projection of `cs --json freeze`. Carries
            `previous_status`, `new_status`, and `event_kind`
            (`MoleculeFrozen` or `MoleculeThawed`).

    StuckEnvelope:
      type: object
      required: [request_id, stuck]
      properties:
        request_id:
          type: string
        stuck:
          type: object
          additionalProperties: true

    ArtifactEntry:
      type: object
      description: |
        One artifact in the per-molecule manifest (e653 spec,
        `task-20260522-ef4f`). Stable shape across the three
        artifact routes — manifest, fetch (response surface), and
        push (response envelope).
      required: [name, content_type, size_bytes, integrity, created_at, token]
      properties:
        name:
          type: string
          description: Filename (basename, no path separator).
        content_type:
          type: string
          description: |
            MIME type detected from the filename extension; defaults
            to `application/octet-stream` for unknown extensions.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: File size in bytes at scan time.
        integrity:
          $ref: "#/components/schemas/IntegrityHash"
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of the file's last modification.
        token:
          type: string
          pattern: "^art_[a-z0-9]{24}$"
          description: |
            Opaque token used to fetch the binary. Deterministic over
            `(molecule_id, name)` so a refetch with no on-disk change
            returns the same token.

    IntegrityHash:
      type: object
      description: |
        `{algo, hex}` tuple. `algo` is `"blake3"` for V0 — open by
        contract for future algos.
      required: [algo, hex]
      properties:
        algo:
          type: string
          example: blake3
        hex:
          type: string
          description: Lowercase hex digest.

    ArtifactManifest:
      type: object
      description: |
        Response envelope for `GET /v1/molecules/{id}/artifacts`
        (e653 spec, `task-20260522-ef4f`).
      required: [request_id, molecule_id, artifacts]
      properties:
        request_id:
          type: string
          description: Opaque correlation id.
        molecule_id:
          type: string
          description: Echo of the molecule id from the URL.
        artifacts:
          type: array
          description: Sorted by `name` for byte-stable output.
          items:
            $ref: "#/components/schemas/ArtifactEntry"

    ArtifactPushedEnvelope:
      type: object
      description: |
        Response envelope for `PUT /v1/molecules/{id}/artifacts/{name}`
        (e653 spec, `task-20260522-ef4f`).
      required: [request_id, artifact]
      properties:
        request_id:
          type: string
        artifact:
          $ref: "#/components/schemas/ArtifactEntry"

    TackleEnvelope:
      type: object
      description: |
        Response envelope for `POST /v1/molecules/:id/tackle`
        (T9 Tenant-Demo V2, `task-20260512-c6de`).
      required: [request_id, tackle]
      properties:
        request_id:
          type: string
        tackle:
          type: object
          additionalProperties: true
          required: [molecule_id, worker_session, spawned_at]
          properties:
            molecule_id:
              type: string
              description: Echo of the tackled molecule id.
            worker_session:
              type: string
              nullable: true
              description: |
                Opaque worker session identifier — typically the tmux
                session name spawned by `cs tackle`. Nullable when the
                CLI did not surface a session name (rare, e.g. dry-run
                mode).
            spawned_at:
              type: string
              format: date-time
              description: |
                RFC 3339 timestamp at which the worker was spawned.
                Falls back to the adapter wall clock if `cs tackle`
                did not stamp one in its JSON output.

    MoleculeView:
      type: object
      description: |
        Public projection of a molecule. The exact field set is
        intentionally lenient — additional fields may appear without
        bumping the API version, but the contract is that `id`,
        `kind`, and `status` are always present.
      additionalProperties: true
      required: [id, kind, status]
      properties:
        id:
          type: string
          description: Molecule identifier.
        kind:
          type: string
          description: |
            Molecule kind — one of `idea`, `task`, `decision`,
            `issue`, `signal`, `deliberation`. Encoded as a string
            for forward compatibility.
        status:
          type: string
          description: |
            Lifecycle status — `pending`, `active`, `running`,
            `completed`, `collapsed`, `frozen`, etc.
        last_5_events:
          type: array
          maxItems: 5
          description: |
            Optional tail of the molecule's event log.
          items:
            $ref: "#/components/schemas/MoleculeEvent"

    MoleculeEvent:
      type: object
      required: [ts, kind]
      properties:
        ts:
          type: string
          format: date-time
        kind:
          type: string
          description: |
            Event kind (e.g. `Nucleated`, `Tackled`, `Tagged`,
            `Collapsed`, `Frozen`, `Thawed`, `Stuck`, `Completed`).

    NoyauxResponse:
      type: object
      required: [noyaux]
      description: |
        Discovery envelope for `GET /v1/noyaux` (task-20260523-eb61).
        Echoes the per-`sub` projection of the sealed nucleon map —
        one row per noyau the JWT principal is bound to, with the
        per-noyau binding count and the absolute path of the noyau's
        galaxy tree on the adapter host. Empty array when no nucleon
        binding exists for the principal.
      properties:
        noyaux:
          type: array
          description: |
            One entry per noyau visible to the JWT's `sub`. Order is
            first-occurrence in the underlying `(iss, sub)` map (a
            `BTreeMap`), so deterministic across boots.
          items:
            $ref: "#/components/schemas/NoyauEntry"

    NoyauEntry:
      type: object
      required: [id, binding_count, galaxies_root]
      properties:
        id:
          type: string
          description: |
            Noyau identifier (e.g. `"tenant-demo-sandbox"`,
            `"operator-sandbox"`). Used as the `--noyau` slug by the
            operator-host CLI.
        binding_count:
          type: integer
          format: int64
          minimum: 1
          description: |
            Number of `(iss, sub) → noyau` rows backing this noyau
            for the JWT's `sub`. ≥ 1 by construction (zero-count
            rows are not emitted). > 1 when an operator is bound
            under several pinned issuers (multi-IdP), all resolving
            to the same noyau.
        galaxies_root:
          type: string
          description: |
            Absolute path of the noyau's galaxy tree on the adapter
            host (`<galaxies_root>/<id>`). The operator-host CLI
            uses this to scope subprocess invocations.

    AuthMeResponse:
      type: object
      required: [sub, aud, scopes, noyau, expires_at, issuer]
      description: |
        Whoami envelope for `GET /v1/auth/me` (task-20260522-560a).
        Echoes only what the server already trusts after JWT
        validation — raw token bytes and the `jti` claim are
        deliberately omitted.
      properties:
        sub:
          type: string
          description: |
            `sub` claim — the principal identifier the IdP signs into
            the token.
        aud:
          type: array
          items:
            type: string
          description: |
            `aud` claim. Always carried as a one-element array so the
            response shape is stable whether the IdP issues a string
            or a list at the token level (RFC 7519 allows both).
        scopes:
          type: array
          items:
            type: string
          description: |
            Scopes carried by the JWT itself. Does NOT include
            binding-granted scopes from the nucleon map — those are
            an authorization detail the whoami route deliberately
            does not leak.
        noyau:
          type: string
          nullable: true
          description: |
            Tenant axis bound to `(iss, sub)`. `null` when no
            nucleon binding exists for the principal — the JWT is
            valid but not yet provisioned for any tenant.
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiry as ISO-8601 UTC (`YYYY-MM-DDTHH:MM:SSZ`).
            Formatted server-side from the `exp` claim so callers do
            not need to parse the JWT themselves.
        issuer:
          type: string
          description: |
            `iss` claim — the IdP that signed the token (e.g. the
            cosmon `cs-oidc-mock` issuer URL or a Forgejo instance).
        claude_credentials_present:
          type: boolean
          nullable: true
          description: |
            Whether a worker could start with the container's Claude
            Code credentials: the file is readable, parseable, and
            carries a token that is either unexpired or renewable
            from a stored refresh token. `null` when the auth-claude
            surface is not configured on this deployment (the server
            cannot know). Additive field (smithy C1 onboarding).

            Semantics tightened by issue #48. It previously reported
            a bare file-existence check, which answered `true` for a
            placeholder or expired file while the worker refused to
            start. The field name and type are unchanged — the only
            behavioural difference is that cases which used to answer
            `true` incorrectly now answer `false`, with
            `claude_credentials_status` naming the cause. The check is
            local, so it is necessary and not sufficient: a token
            revoked upstream still reads as usable.
        claude_credentials_status:
          type: string
          nullable: true
          enum: [usable, refreshable, absent, unreadable, malformed, expired]
          description: |
            Which precondition decided `claude_credentials_present`.
            `null` exactly when that field is `null`. Additive field
            (issue #48) — the enumeration is additive-only, so clients
            must treat an unrecognised value as "some other cause"
            rather than an error.

            `usable` / `refreshable` accompany `true`; `absent`,
            `unreadable`, `malformed` and `expired` accompany `false`.
            The distinction is actionable: `absent` and `expired` call
            for `auth login`, while `unreadable` is an operator-side
            filesystem problem on the container that logging in again
            will not repair.
        version:
          type: string
          description: |
            Adapter binary version, aligned on the cosmon release
            version — the same string as the release tag, the tarball
            filename and `cosmon-rpp-adapter --version` (a release
            `v0.2.1` reports `"0.2.1"`). Mirrors
            `/healthz` so an authenticated client gets the same answer
            without a second round-trip. Additive field
            (delib-20260610-9a0c, tolnay).
        api_surface_version:
          type: integer
          description: |
            Number of `surface_added` events the binary was compiled
            with (monotonic — `data/surface_events.txt` is
            append-only). Clients may compare against their own
            compiled-in count and emit an informative note on
            mismatch — never blocking, never a `/v2/`. Additive field
            (delib-20260610-9a0c, tolnay).

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Coarse-grained error label.

            **Open by contract.** The server may emit new labels in
            future versions without an API bump. Callers MUST treat
            any unknown value as semantically equivalent to
            `internal` (i.e. retry-on-idempotent, surface-as-opaque).
            Known values at v1.0.0 include `unauthorized`,
            `forbidden`, `not_found`, `invalid_filter`,
            `invalid_json_body`, `missing_reason`, `empty_reason`,
            `empty_tag_request`, `terminal_status`, `invalid_status`,
            `rate_limited`, `store_unavailable`, `endpoint_removed`,
            `internal` — but this list is *informative*, not
            normative. Mirror of the lenient `#[non_exhaustive]` +
            `#[serde(other)] Unknown(String)` discipline already
            inscribed for `Status` / `Kind` / `MoleculeEventKind`.

            The wire body never carries `sub`, `nucleon_id`, or any
            tenant-identifying field.
        request_id:
          type: string
          description: |
            Optional correlation id; present on errors that
            materialise an audit envelope.

    QuotaResponse:
      type: object
      required: [request_id, limits, current, remaining, reset_at]
      properties:
        request_id:
          type: string
          description: |
            Audit-correlation id for the inbox-materialised admission
            row of this `/v1/quota` call. The same value lands in
            `<state_dir>/whispers/inbox/api/<request_id>.json`.
        limits:
          type: object
          required: [burst_capacity, leak_per_minute, leak_per_hour]
          properties:
            burst_capacity:
              type: integer
              format: int64
              minimum: 0
              description: Maximum tokens the bucket can hold.
            leak_per_minute:
              type: number
              format: double
              minimum: 0
              description: "Tokens drained per minute (V0 = 10)."
            leak_per_hour:
              type: number
              format: double
              minimum: 0
              description: "Tokens drained per hour (V0 = 600)."
        current:
          type: object
          required: [bucket_level, bucket_level_floor]
          properties:
            bucket_level:
              type: number
              format: double
              minimum: 0
              description: |
                Live bucket level, drained to the request's wall-clock.
            bucket_level_floor:
              type: integer
              format: int64
              minimum: 0
              description: Floor of `bucket_level`, useful for tables.
        remaining:
          type: integer
          format: int64
          minimum: 0
          description: |
            `floor(burst_capacity − bucket_level)`. Equal to the
            `X-RateLimit-Remaining` header on the same response.
        reset_at:
          type: string
          format: date-time
          description: |
            ISO-8601 wall-clock at which the bucket will be fully
            drained back to zero. Equal to the `X-RateLimit-Reset`
            header on the same response.

    # Operational diagnostics body (task-20260523-d820, gap-report ae3d
    # workflow §i). Shape is *additive* — clients MUST ignore unknown
    # top-level keys so the adapter can grow the projection without
    # breaking dashboards.
    DiagnosticsBody:
      type: object
      required:
        - service
        - version
        - posture
        - uptime_seconds
        - nucleon_map
        - jwks
        - backends
        - rate_limit
        - events
        - rejects
        - http_responses
      properties:
        service:
          type: string
          description: Service identifier — always `cosmon-rpp-adapter`.
        version:
          type: string
          description: |
            Crate semver of the running binary (e.g. `0.1.0`). Bumps
            whenever the adapter is rebuilt; dashboards compare across
            scrapes to detect a rolling restart.
        posture:
          type: string
          enum: [prepared, active]
          description: Adapter posture (ADR-076 §3).
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Seconds since the in-RAM metrics registry was constructed
            (≈ adapter boot). Reset on restart.
        nucleon_map:
          type: object
          required: [bindings, noyaux]
          properties:
            bindings:
              type: integer
              minimum: 0
              description: Active `(iss, sub)` bindings in the sealed map.
            noyaux:
              type: integer
              minimum: 0
              description: Distinct noyaux covered by the bindings.
        jwks:
          type: object
          required: [issuer_count, total_keys, by_issuer]
          properties:
            issuer_count:
              type: integer
              minimum: 0
            total_keys:
              type: integer
              minimum: 0
            by_issuer:
              type: array
              items:
                type: object
                required: [issuer, keys]
                properties:
                  issuer:
                    type: string
                  keys:
                    type: integer
                    minimum: 0
        backends:
          type: object
          required: [count, snapshot]
          properties:
            count:
              type: integer
              minimum: 0
            snapshot:
              type: array
              description: |
                Same shape as the body of `GET /health/backends` —
                inlined so a single `/diagnostics` round-trip covers
                the dashboard.
              items:
                type: object
                required: [name, status]
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: [ok, degraded, down, configured-but-unused]
                  last_check_ms:
                    type: integer
                    format: int64
                  latency_p95_ms:
                    type: integer
                    minimum: 0
        rate_limit:
          type: object
          required: [capacity, leak_per_minute, leak_per_hour]
          properties:
            capacity:
              type: number
              description: Burst capacity (tokens).
            leak_per_minute:
              type: number
            leak_per_hour:
              type: number
        events:
          type: object
          required: [subscribers, capacity]
          properties:
            subscribers:
              type: integer
              minimum: 0
              description: |
                Live SSE subscriber count on the broadcast bus.
            capacity:
              type: integer
              minimum: 1
              description: Per-bus backlog window.
        rejects:
          type: object
          required: [total, by_reason]
          properties:
            total:
              type: integer
              format: int64
              minimum: 0
            by_reason:
              type: array
              items:
                type: object
                required: [reason, count]
                properties:
                  reason:
                    type: string
                    description: |
                      Stable label from `RppRejectReason::label`
                      (e.g. `expired`, `unknown_sub`,
                      `audience_mismatch`).
                  count:
                    type: integer
                    format: int64
                    minimum: 0
        http_responses:
          type: object
          required: ["1xx", "2xx", "3xx", "4xx", "5xx"]
          description: Status-class counters since boot.
          properties:
            "1xx":
              type: integer
              format: int64
              minimum: 0
            "2xx":
              type: integer
              format: int64
              minimum: 0
            "3xx":
              type: integer
              format: int64
              minimum: 0
            "4xx":
              type: integer
              format: int64
              minimum: 0
            "5xx":
              type: integer
              format: int64
              minimum: 0

    WorkersResponse:
      type: object
      required: [request_id, workers, count]
      description: |
        Response body for `GET /v1/workers` (`task-20260523-f82b`,
        gap report ae3d workflow §e priority 5). Lists the active
        workers in the caller's noyau.
      properties:
        request_id:
          type: string
          description: |
            Audit-correlation id for the inbox-materialised admission
            row of this `/v1/workers` call.
        workers:
          type: array
          description: |
            Active workers, sorted by `started_at` ascending so a
            paginating client sees a deterministic enumeration.
            Empty when no molecule carries a live process record.
          items:
            $ref: "#/components/schemas/WorkerEntry"
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of active workers (workers.length).

    WorkerEntry:
      type: object
      required: [molecule_id, session_name, started_at, tmux_session]
      description: |
        One worker entry inside [`WorkersResponse`]. Stable
        additive-only wire shape: adding a field is allowed; renaming
        or removing one is a §8p break.
      properties:
        molecule_id:
          type: string
          description: |
            Molecule the worker is bound to (the inline
            `MoleculeProcess` slot on the molecule's state).
        session_name:
          type: string
          description: |
            Worker identity stamped at `cs tackle` time — the same
            string the operator sees in `cs status` rows. Currently
            equal to the tmux session name; the two fields are kept
            distinct so they can evolve independently.
        started_at:
          type: string
          format: date-time
          description: |
            ISO-8601 / RFC 3339 instant when the process record was
            created (typically by `cs tackle`).
        pid:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Operating-system PID when the transport backend surfaced
            one. `null` for backends that do not expose PIDs (legacy
            or in-process adapters). The field is always present so
            clients can branch on its absence rather than on a
            missing key.
        tmux_session:
          type: string
          description: |
            Tmux session owning the worker process — same string that
            `tmux -L <socket> attach -t <session>` would target.

tags:
  - name: molecules
    description: |
      The eight RPP-exposable verb routes (V0 read-only +
      V1 mutation cuts). Surface frozen by
      `tests/api_surface_freeze.rs`.
  - name: artifacts
    description: |
      Three filesystem-mediated routes (e653 spec, `task-20260522-ef4f`)
      that expose the worker's outputs under
      `<artifact_root>/<noyau>/<molecule_id>/`. Required scopes:
      `cosmon:artifact:read` (GETs) and `cosmon:artifact:write` (PUT).
  - name: auth
    description: |
      Admission-side authentication helpers. `GET /v1/auth/me`
      (task-20260522-560a) is JWT introspection / whoami — valid JWT
      is the whole gate, no scope check.
  - name: quota
    description: |
      Rate-limit snapshot (`task-20260522-2f91`, gap report ae3d §h).
      Read face of the §8j(c) leaky bucket; carries the same
      `X-RateLimit-*` headers as every other `/v1/` route.
  - name: noyaux
    description: |
      Multi-noyau discovery (`task-20260523-eb61`, gap report ae3d
      §f). Enumerates the noyaux the JWT's `sub` is bound to —
      adapter-only surface, no `cs` CLI verb counterpart.
  - name: operational
    description: |
      Operator-facing endpoints outside `/v1/` — `/healthz`,
      `/metrics`, `/diagnostics`. Unauthenticated, deliberately
      excluded from the §8p frozen API surface. Carry **no
      per-tenant data**: aggregate counters and projection sizes
      only (task-20260523-d820, gap report ae3d §i).
  - name: workers
    description: |
      Active workers in the caller's noyau (`task-20260523-f82b`,
      gap report ae3d §e priority 5). Read-only; required scope
      `cosmon:worker:read`. Adapter-only — no `cs` CLI verb
      counterpart since operator-side observability already uses
      `cs status` / `cs ensemble` against the on-disk fleet.
