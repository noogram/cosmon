# ==========================================================================
# cosmon-dev.spore.toml — the FIRST spore of the cosmon repo (dogfooding).
#
# WHAT IT IS
#   A spore is a parameterizable template of a WHOLE polymer: a fleet + per-node
#   formulas + a ParamSchema + a DAG of typed edges + a TLC-checkable .tla seal
#   (ADR-139 / ADR-140). This one germinates the ROBUST-DEV mission: one issue
#   reported by an external tester becomes a deterministic RED reproduction (a
#   validation gate), a smallest FIX, a DOUBLE clean-room review by two DIFFERENT
#   provider families rendered as two immutable verdicts, then a RELEASE. No agent pushes to a
#   remote (the human gate is the only door to the world).
#
# GUIDING PRINCIPLE — REUSE, DO NOT REINVENT.
#   This spore WIRES existing cosmon primitives; it rewrites NONE of them.
#     * `task-work`                (../../.cosmon/formulas/) — the agentic gate legs.
#     * `while`                    (../../.cosmon/formulas/) — the iterate-until-condition
#                                    loop. NO LONGER COMPOSED HERE: it was the N-round
#                                    infrastructure `converge-clean-room` v2 deleted
#                                    (operator decision D1 amendment 1 on
#                                    delib-20260729-1d4e). Two named verdict states are
#                                    not an iteration, and borrowing an iteration
#                                    primitive to express them would re-import the
#                                    counter through the back door.
#     * `cross-provider-committee` (../../.cosmon/formulas/, ADR-147) — the jury that
#                                    is provider-diverse BY CONSTRUCTION (adapter-pinned
#                                    seats). One claude seat + one codex-sol (gpt-5.6-sol)
#                                    seat = OUR double clean-room review. Composed BY
#                                    `converge-clean-room`, not copied. NEVER a
#                                    deep-think panel (claude-only = A->A, an echo).
#     * `bug-closure`              (../../.cosmon/formulas/) — the CLOSED/REOPEN verdict
#                                    over the full semantic surface = OUR closure gate.
#                                    Since the coverage amendment it runs ASYNCHRONOUSLY,
#                                    after the polymer has already landed a candidate.
#   Only TWO formulas are genuinely NEW and ship in formulas/ here:
#     * `clean-room-repro`      — the G2 reproduction gate (deterministic red, frozen
#                                  before the fix branch, differential refutation,
#                                  false-green / false-red modes). Emits verdict.json.
#     * `converge-clean-room`   — the §6bis double-engine convergence, rendered as TWO
#                                  IMMUTABLE VERDICTS (INITIAL, CONFIRMATION) over
#                                  `cross-provider-committee`. It reads the seats'
#                                  verdict.json, fail-closes on absent/malformed —
#                                  into a VOID verdict that does not advance the state,
#                                  never into a FINDINGS verdict — and computes CLEAN as
#                                  the conjunction over the BALLOT-CARRYING seats only.
#                                  No round counter, no round ledger, no third verdict.
#
# THE GATE DAG (blueprint §3, diamond topology — NOT a pipeline; a pipeline
# diffuses responsibility by construction):
#
#   trace (root+leaf, always-on sidecar)
#
#   route (SECOND ROOT — no incoming edge, no ${params.issue}) ───────────────────┐
#                                                                                 │
#   intake(G0) -> contract(G1) -> reproduce(G2) ─┬─> implement(G4) ─┐             │
#                                               │                  ├─> green(G5)  │
#                                               └─> falsify(G3) ───┘      │       │
#                                                                         v       │
#                                                                   ci-gate(G8)   │
#                                                                    ┌────┴────┐  │
#                            converge (§6bis, EMERGENT — the two-    │         │  │
#                            verdict double clean-room; replaces  <──┘         └─> rehearsal(G9)
#                            G6 breaker + G7 judge)                │              │
#                                                                  └───┬──────────┘
#                                                                      v
#                                                          release(G10) => CANDIDATE-LANDED
#                                                                      ⋯
#                                                          confirm(G11) => CLOSED, ASYNCHRONOUS
#
# THREE ROOTS, AND THE SECOND ONE IS THE POINT. `route` descends from NOTHING —
# not from intake, not from contract, not from reproduce — and its topic is
# FORBIDDEN from interpolating ${params.issue}. It is the arm nobody chose: the
# published install route, walked on a substrate that has never run cosmon, by a
# brief that never learnt what we think is broken. The measured reason it exists:
# every internal seat read the same exhibit list, and the winning defect was found
# by an outsider who ran an arm no seat ran. Provider diversity diversifies the
# JUDGE; it does not diversify the EXHIBIT. Two readers of one exhibit list are one
# measurement taken twice. `route` gates `release` and NOT `converge`, so it cannot
# be argued with in the convergence vocabulary.
#
# COVERAGE IS DECLARED, NEVER TESTIFIED. Every review seat writes
# `surface_enumerated` — the arms, paths and commands it will exercise — BEFORE it
# reviews. That turns "I reviewed X" from testimony into a claim with a domain, and
# `release` compares the declared surfaces against the enumerated semantic surface
# and BLOCKS on a gap it cannot explain. The E1 miss was never a sensitivity
# failure: the seats produced findings twelve rounds running. It was a COVERAGE
# failure, and a canary planted in a region no seat visits tests nothing.
#
# THE REHEARSAL MATRIX IS UNCONDITIONAL. Root AND non-root, amd64 AND arm64,
# whatever `risk` says. It used to open only at release/security while `risk`
# defaulted to `normal` — so the default posture switched off the exact arm the #20
# defect lived in (a refused root dispatch leaving root-owned residue), and E3's
# `#[ignore]`d root-only suite that ran on nobody's machine is the same class, second
# occurrence, in this same file. A cell that DID NOT RUN is BLOCKED, never skipped.
#
# `arms_not_run[]` IS MANDATORY AND NON-EMPTY. Not a verdict — a declared blind
# spot. A release manifest claiming there is no unrun arm is REFUSED. The winning
# defect lived in the negative space of a document nobody wrote; this field is that
# document, and it costs one paragraph.
#
# TWO FALSE SERIALIZATIONS REMOVED, ZERO CHECKS REMOVED. `review ∥ rehearsal`: both
# are fed by `ci-gate` and both feed `release`, instead of the old
# ci-gate -> converge -> rehearsal -> release chain — the rehearsal never needed the
# review's verdict, only the CI's green. And `confirm` (G11) leaves the blocking
# path: the polymer's terminal success state is CANDIDATE-LANDED at `release`, and
# G11's external replay flips it to CLOSED afterwards. One long serial leg becomes
# two parallel ones; that is free latency, sitting in the edge list.
#
# CLEAN = BALLOT-WEIGHTED CONJUNCTION. Every BALLOT-CARRYING seat (`on_ballot` and
# `diversity_weight > 0`) must return CLEAN in the SAME verdict, and the
# ballot-carrying set must be NON-EMPTY. A single FINDINGS from a ballot-carrying
# seat blocks; the fix corrects the UNION of the ballot-carrying reports (keystone
# K4: a single cross-model FAIL blocks; the bloc-claude counts as ONE voice,
# codex-sol is the second substrate). Seats the roster itself puts off the ballot —
# a seat whose resolved family collides with the generator's carries zero diversity
# weight — have their findings RECORDED as residuals and block nothing on their own,
# because an off-ballot CLEAN certifies nothing and must not be asked to.
#
# A verdict that MEASURED NOTHING is not a verdict. An absent, malformed,
# unparseable or undelivered seat verdict makes the whole verdict VOID: the reason
# is recorded, the state does NOT advance, the seat is re-dispatched once, and a
# second void collapses on `verdict-plumbing`. Fail-closed is right about the
# VERDICT and was wrong about the CONTROL FLOW — a plumbing failure must never be
# reported as a quality verdict and then patched against findings nobody collected.
#
# LIMITE DURE (codex-sol #28, buterin, blueprint §8): the edges ORDER molecules;
# they do NOT prove a review passed or that two seats had distinct identities.
# Every gate EMITS and VALIDATES a machine-readable verdict artifact and
# FAIL-CLOSES if it is absent or malformed. `release` validates the WHOLE
# manifest; it never infers success from predecessor completion. The spore germs
# the TOPOLOGY, not the human independence (identities, credentials,
# branch-protection stay external controls).
#
# AND HERE IS WHAT §8 DID NOT FORBID. Read as a proposition, the paragraph above
# forbids exactly one class of observation: a gate that shipped without a
# parseable verdict file. It forbids nothing about the relation between that
# file's CONTENTS and the world. `{"verdict":"PASS","count":0,"findings":[]}`
# satisfies it completely — and that is precisely the byte sequence a gate emits
# when it measured the property NEXT DOOR, when its ledger was untracked, when
# its suite was `#[ignore]`d, and when its `..._byte_identical` assertion compared
# modes. Seven observations, seven passes; a rule all seven counter-examples
# satisfy was never a claim about them. Say it in the file it governs:
#
#   *A well-formed verdict artifact saying PASS is exactly what a gate measuring
#   the property next door emits; §8 constrains the SHAPE of the evidence, never
#   its RELEVANCE.*
#
# That is not repaired by stronger prose — rewriting §8 more emphatically
# produces an eighth instance. It is repaired by three fields that a PASS is
# INADMISSIBLE without, because each one is falsifiable by a consumer:
#
#   * `negative_control {mutation, target, observed_verdict, evidence_digest}` —
#     the gate was run against a DELIBERATELY BROKEN world and returned the
#     OPPOSITE verdict. `observed_verdict == verdict` means the gate is
#     colour-blind and its PASS is VOID. This is the `falsify` node's own
#     discipline — *a test whose colour does not move when the fix is mutated is
#     a tautology, not an oracle* — applied to EVERY gate instead of to one. The
#     asymmetry had no justification: G2 got the treatment because G2's output is
#     a test and tests are where we habitually think about colour. The property is
#     not about tests.
#   * `population` — the DENOMINATOR. `count == 0 ∧ population == 0` is a vacuous
#     green: a universal over an empty domain forbids nothing. The CI wait loop
#     that read zero pending runs over an EMPTY LIST is the same logical error as
#     the `#[ignore]`d suite and the provenance gate that printed `skip` and
#     exited 0. One schema field retires an entire failure family, which is a
#     better return than any amount of increased carefulness.
#   * `subject_digest` — a hash of WHAT WAS MEASURED, RECOMPUTED BY THE CONSUMER,
#     never asserted by the producer. A digest the consumer only reads back is a
#     producer's testimony with a hexadecimal accent.
#
# AMORTISED BY FREEZE-AND-KEY, or it is unpayable. The negative control is an
# ADMISSION test on the GATE'S OWN DEFINITION, keyed by a hash of that definition
# (the node's `topic` + the script it invokes). A gate whose definition hash has
# no admission record is BLOCKED at first use; once admitted, every subsequent
# mission COPIES THE RECORD FORWARD and pays nothing. Cost is O(gate edits), not
# O(missions). The mutations are scoped to the gate's own decision, never
# workspace-wide, and each is minutes: plant one `clippy::needless_return` and
# confirm the RECORDED clippy exit code flips; install the dev build instead of
# the packaged artefact and confirm `rehearsal` BLOCKS; strip the arch field and
# confirm `intake` BLOCKS.
#
# NO SIDE LEDGER. The admission record is copied INTO each gate's `verdict.json`
# and the consumer RECOMPUTES the key. An `admission.json` the consumer reads
# without recomputing is the provenance gate rebuilt — the one that printed `skip`
# and exited 0.
#
# `base_sha` IS NOT `parent_commit`. Two different facts, collapsed into one field
# until now: `parent_commit` is what the red was RED on; `base_sha` is what THIS
# VERDICT WAS COMPUTED ON. Every verdict.json carries `base_sha`, and `release`
# BLOCKS if any upstream verdict's `base_sha` is not an ancestor of the release
# commit — which is how a verdict computed on a tree nobody is shipping stops
# counting as evidence about the tree everybody is.
#
# WHY THE ENFORCEMENT POINT IS THE RELEASE MANIFEST, AND THE FALSIFIER THAT
# AUDITS THAT CLAIM. Every one of the seven §8-satisfying gates shares one
# property: the thing the gate guarded PROCEEDED whether or not the gate ran. The
# release manifest has the inverse property — ITS ABSENCE IS THE ABSENCE OF THE
# RELEASE. You cannot silently stop enforcing a rule whose enforcement product is
# the artifact the mission exists to produce. That is the whole immunity argument,
# and it is written here so it can be AUDITED rather than assumed:
#   FALSIFIER — exhibit a path by which a release ships WITHOUT a manifest, and
#   the argument is refuted and withdrawn.
#
# RECIPIENT QUICKSTART (run from inside spores/cosmon-dev/):
#   cs spore validate spore.toml \
#       --var issue="#21 --resident ignores COSMON_DEFAULT_ADAPTER" \
#       --var affected_ref="v0.2.2" \
#       --var upstream_version="0.2.2"
#   cs spore run spore.toml --var ... --allow-unchecked-seal   # see SEAL HONESTY
# ==========================================================================

[spore]
name        = "cosmon-dev"
version     = 1
verb        = "germinate"    # spore -> polymer, the parallel of nucleate (formula -> molecule)
description = """
Germinate the robust-dev polymer: turn one externally-reported issue into a
deterministic RED reproduction (fails on affected_ref for the RIGHT reason,
frozen before the fix), a smallest FIX, a DOUBLE clean-room review by two distinct
provider families (claude + codex-sol) rendered as two immutable verdicts and
resolved by a ballot-weighted CLEAN or a typed escalation, an UNCONDITIONAL
root/non-root x amd64/arm64 rehearsal of the packaged bytes, an AUTHOR-INDEPENDENT
walk of the published install route by a brief that never learnt what is broken, and
a RELEASE whose manifest must declare, non-empty, the arms it did NOT run. No agent
pushes to any remote. When an external reproduction contradicts an internal proof, the reproduction wins and the proof
becomes the bug.
"""

# --------------------------------------------------------------------------
# Seal — a TLC proof over spore.tla + spore.cfg (THREE properties). Paths are
# RELATIVE to this manifest (portability invariant). Seal-verification contract
# (ADR-140 D4): absent / present+checked / present+unchecked-honest. `cs spore
# run` refuses by default to germinate a present-but-unverified seal; pass
# --allow-unchecked-seal to opt into the risk. It NEVER claims a seal verified
# when it is not.
#
# Termination                  : the convergence is bounded STRUCTURALLY — there are
#                                exactly two named verdict states (INITIAL,
#                                CONFIRMATION) and no counter to raise — and the gate
#                                DAG is acyclic, so every germinated polymer either
#                                drains or reaches a typed `blocked` escalation. No
#                                spin. `max_rounds` survives only as the mechanical
#                                runaway backstop on committees convened.
# GateFailClosed  (LOAD-BEARING): every gate BLOCKS on an absent/malformed verdict;
#                                release SHIPs only if every upstream gate PASSED,
#                                the convergence reached CLEAN, the author-independent
#                                `route` verdict PASSED, every rehearsal cell rendered,
#                                and the dissent field — now a manifest field, no longer
#                                a node — carries a non-empty brief AND a non-empty
#                                `arms_not_run[]`. Absence refuses, always — into a VOID
#                                verdict that cannot advance a state, never into a
#                                FINDINGS verdict that could be patched against.
# NoResourceCollision          : each node (and each of the two convergence verdicts)
#                                is handed a DISTINCT OUTPUT PATH by germination.
#
# WHAT THAT THIRD PROPERTY DOES NOT SAY, stated where it is claimed rather than in
# a footnote. Its argument quantifies over the node OUTPUT PATHS germination hands
# out (`${output_dir}` = `<state>/spore-runs/<germination-id>/<alias>/`, ADR-161)
# and over NOTHING ELSE. It says nothing about the shared source tree, nothing
# about the shared cargo `target/` two parallel gates both build into, and nothing
# about any path a gate's PROSE names by hand. `spore.tla:34-35` lists filesystem
# races under WHAT IS NOT MODELLED, and inside the module `ArtifactPath(r) == r`,
# so the property is the injectivity of `ToString` — sound, cheap, worth keeping,
# and not a statement about your disk. The previous wording here, "parallel
# writers never alias a resource", claimed the disk. That was the overclaim, and
# it is withdrawn.
#
#   THE SEAL MUST ALWAYS SAY TWO THINGS: WHAT IT PROVES AND WHAT IT DOES NOT
#   MODEL. A PROOF OF THE MODEL MUST NEVER BE PRESENTED AS A PROOF OF THE REAL
#   ENVIRONMENT.  (operator, D3 on delib-20260729-1d4e)
#
# Real file collisions are covered SEPARATELY, by an executable test that does
# I/O rather than by a second lexical argument:
# `crates/cosmon-core/tests/spore_real_file_collision.rs`. Its witness is the pair
# ("Route", "route") — two ids the grammar accepts, two DISTINCT strings the seal
# therefore certifies as non-colliding, and ONE directory on APFS or NTFS, where
# the second node's `verdict.json` destroys the first's. Germination now refuses
# that pair on every platform (`RefusedOutputHome::CaseAliased`).
#
# `DeterministicParametrization` IS DELETED (operator decision D3). It was
# tautological: it asserted `Roles = ExpandedRoles` where both names denote the
# SAME thirteen-element literal set, so no reachable state could falsify it. It
# was a theorem about the identity function wearing a property's name, and a
# property that cannot fail is a line in a status report, not a check.
#
# SEAL DIVERGENCE, STATED RATHER THAN HIDDEN: `spore.tla` / `spore.cfg` still model
# the DELETED round counter (MaxRounds), the DELETED `dissent` node and the DELETED
# `review_scale` param, and they do not yet know about `route`, the parallel
# review/rehearsal edges or the asynchronous `confirm`. The model is
# therefore BEHIND this manifest on the node set and the edge set, and a TLC run
# proves a topology this file no longer declares. That is named here because a seal
# must always say what it does not model; re-synchronising the module to the
# CURRENT node and edge set is a separate molecule. This molecule touched
# spore.tla/spore.cfg for the SEAL TRIM ONLY (deleting the tautological property
# and strengthening the Termination variant) and changed no part of the modelled
# topology, so the divergence above is exactly as large as it was, neither wider
# nor narrower. Until the re-synchronisation lands, treat the three properties as
# UNPROVEN for the current topology.
#
# SEAL HONESTY: a released `cs` may report "TLC unavailable" (the TLC-verify wiring
# is not in every released binary), so `cs spore run` fails closed and you germinate
# with --allow-unchecked-seal (the status line stays honest: "seal: present, NOT
# verified"). Re-check the proof directly (any Java 11+; jar at
# ../../docs/specs/tla2tools.jar):
#   export TLA2TOOLS_JAR=../../docs/specs/tla2tools.jar
#   java -XX:+UseParallelGC -cp "$TLA2TOOLS_JAR" tlc2.TLC -workers auto \
#        -config spore.cfg spore.tla
# --------------------------------------------------------------------------
[spore.seal]
module     = "spore.tla"
config     = "spore.cfg"
properties = ["Termination", "GateFailClosed", "NoResourceCollision"]

# --------------------------------------------------------------------------
# ParamSchema (blueprint §8). Three params are REQUIRED (issue, affected_ref,
# upstream_version); the rest carry defaults so the spore expands cleanly for the
# common single-issue case. The node set does NOT depend on any param value (risk
# / max_rounds are POSTURE params that shape node TOPICS, never the node SET).
# That is still true and still worth knowing — it is simply no longer dressed up
# as a checked property, because the module stated it as `Roles = ExpandedRoles`
# over one literal set and nothing could ever falsify it.
#
# `review_scale` is GONE (operator decision D1 on delib-20260729-1d4e). It was
# declared "advisory to the converge node", which is the signature of a knob with no
# reader: two enum values, no branch anywhere that took one, and a seat free to
# ignore it. A parameter nobody honours is not a posture, it is a decoration that a
# reader mistakes for a control.
#
# `risk` no longer has a `release` value either, and for a sharper reason: it used to
# decide whether the rehearsal matrix widened, and its DEFAULT switched that widening
# off. The matrix is now unconditional, so the only thing `risk` still selects is the
# jury floor — and per D1 amendment 2 the switch to `security` is MECHANICAL, derived
# from what the diff TOUCHES, never from a field a tired pilot fills in by habit.
# --------------------------------------------------------------------------
[spore.params.issue]
type        = "string"
required    = true
description = "The reported defect: id, title, and the tester's verbatim symptom. The trusted evidence, kept separate from any inferred mechanism."

[spore.params.affected_ref]
type        = "string"
required    = true
description = "The git ref the RED reproduction MUST fail on, for the RIGHT reason (e.g. v0.2.2). The clean-room checks out this ref via `git archive`, never the live worktree."

[spore.params.upstream_version]
type        = "string"
required    = true
description = "The released version the external tester actually ran (what the world saw fail)."

[spore.params.risk]
type        = "enum"
values      = ["normal", "security"]
default     = "normal"
description = """
The JURY FLOOR, and nothing else — the rehearsal matrix no longer reads it (it is \
unconditional). `normal` => the committee's two ballot-carrying families (anthropic \
via `claude` + openai via `codex-sol`). `security` => a THIRD distinct family, \
conjunctive, named concretely so nobody has to invent one under pressure: the \
`openai` adapter with `base_url = https://api.mistral.ai` and \
`default_model = mistral-large-latest` — the EU-sovereign warm standby already \
declared in ../../.cosmon/config.toml, which `provider_diversity` resolves to family \
`mistral`, distinct from both `anthropic` and `openai`. It needs MISTRAL_API_KEY \
exported and no new adapter, no new spawn arm.

ENTRY IS MECHANICAL, NEVER THE PILOT'S JUDGEMENT (operator decision D1 amendment 2 \
on delib-20260729-1d4e). `security` is DERIVED FROM WHAT THE DIFF TOUCHES, not from \
this field: the germinating pilot runs `git diff --name-only <affected_ref>..HEAD` \
and the value is `security` if ANY changed path matches the security surface — \
crates/cosmon-core/src/auth.rs, egress*.rs, root_spawn_policy.rs, credential*.rs, \
adapter_attribution.rs, anything under scripts/publish.sh or docs/specs/, any \
uid/root/signing/token/key-handling path — and `normal` only when NONE does. Passing \
`--var risk=security` by hand is allowed as a widening; passing `normal` over a \
matching diff is a LIE the release manifest must record and BLOCK on. The reason is \
measured, not aesthetic: `risk = normal` was the DEFAULT, and it switched off exactly \
the arm the #20 defect lived in. A criterion a tired pilot fills in by habit is not a \
criterion.
"""

[spore.params.max_rounds]
type        = "int"
default     = 2
description = """
RUNAWAY BACKSTOP, NOT THE CONTROL FLOW. Since `converge-clean-room` v2 the control \
flow is two immutable verdict states (INITIAL, CONFIRMATION) and this number governs \
no decision inside it. It is the mechanical ceiling on committees convened, so a \
wiring bug that re-enters the convergence cannot foam, and it is the quantity the \
seal's Termination bound reads. It bounds COST, never INFORMATION: raising it buys \
more committees, not more measurement — twelve rounds over five days bought one \
measurement and eleven repetitions of it. Two named states means two committees, so \
the honest value is 2; any other value says something upstream is wrong. Exceeding \
it is a WIRING failure (`exit_reason: verdict-plumbing`), not a quality signal.
"""

# --------------------------------------------------------------------------
# Fleet — the default cosmon fleet (this is dogfooding inside the cosmon repo).
# The stanza used to carry `concurrency_cap` and `isolation`; both were retired
# in task-20260730-5a0d because no scheduler read either one. `cs tackle`
# creates a worktree unconditionally, so non-aliasing writes hold structurally
# rather than by declaration — which is what NoResourceCollision needs and what
# a knob that governed nothing was never providing.
# --------------------------------------------------------------------------
[spore.fleet]
name            = "default"

# --------------------------------------------------------------------------
# Per-node recipes — formula aliases. Paths RELATIVE to this manifest.
#   REFERENCED (repo primitives, not copied):
#     task-work    -> ../../.cosmon/formulas/task-work.formula.toml
#     bug-closure  -> ../../.cosmon/formulas/bug-closure.formula.toml
#   NEW (ship here, genuinely new plumbing the primitives cannot compose directly):
#     clean-room-repro     -> formulas/clean-room-repro.formula.toml
#     converge-clean-room  -> formulas/converge-clean-room.formula.toml
# The convergence formula itself composes ../../.cosmon/formulas/cross-provider-committee.formula.toml
# at RUN time by nucleation — a dependency of `converge-clean-room`, not a spore node.
# It NO LONGER composes while.formula.toml: that was the N-round machinery, deleted
# with the round counter it existed to drive.
# --------------------------------------------------------------------------
[spore.formulas.task-work]
path          = "../../.cosmon/formulas/task-work.formula.toml"
description   = "Generic agentic gate leg (referenced repo primitive). The gate's verdict contract lives in each node's topic; task-work is not modified."
deterministic = false

[spore.formulas.clean-room-repro]
path          = "formulas/clean-room-repro.formula.toml"
description   = "NEW — the G2 reproduction gate: a deterministic red that fails on affected_ref for the right reason, frozen (hashed) before the fix branch, with differential refutation + false-green/false-red modes. Emits verdict.json."
deterministic = false

[spore.formulas.converge-clean-room]
path          = "formulas/converge-clean-room.formula.toml"
description   = "NEW — the §6bis double-engine convergence as TWO IMMUTABLE VERDICTS (INITIAL, CONFIRMATION) over `cross-provider-committee`; CLEAN is the conjunction over the BALLOT-CARRYING seats; an absent/unparseable/undelivered verdict is VOID and does not advance the state; a repeated finding set or verdict shape exits immediately; no round counter, no third verdict."
deterministic = false

[spore.formulas.bug-closure]
path          = "../../.cosmon/formulas/bug-closure.formula.toml"
description   = "Referenced repo primitive — the CLOSED/REOPEN verdict over the bug's full semantic surface. OUR closure gate (G11)."
deterministic = false

# ==========================================================================
# The DAG (declaration order; diamond topology, blueprint §3).
# ==========================================================================

# --- trace (always-on append-only sidecar; root+leaf, no edges) -----------
# Germinates the instant the polymer does (no blocked-by) and nothing depends on
# it (leaf), so a stall anywhere downstream never strands the trace. NOT gated on
# anything. It captures the append-only record of what ran, on what model,
# producing what bytes — the consolation artifact if the mission stalls.
[[spore.node]]
id          = "trace"
kind        = "fixed"
formula     = "task-work"
description = "Always-on append-only trace sidecar (raw events + per-node briefs + artifact hashes). Root+leaf: survives a downstream stall."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — TRACE SIDECAR (always-on). Open an append-only trace
under trace/ the instant this polymer germinates, INDEPENDENT of whether the gate
DAG completes. Capture, as they happen: the raw cosmon events (nucleation / tackle
/ evolve / complete / collapse) for THIS polymer, each node's germinated brief
(topic + formula), and a content hash + byte count for every artifact any node
writes. READ-ONLY on .cosmon/state/ — copy into ${output_dir}/, never mutate. Emit
${output_dir}/events.jsonl, ${output_dir}/briefs.md, ${output_dir}/hashes.tsv
(${output_dir} is the run-scoped home germination hands you — ADR-161 — never a
path under spores/cosmon-dev/ or the repo root). Even if the mission stalls or a
worker dies, ${output_dir}/ must let a third party reconstruct what ran.
"""

# --- route (SECOND ROOT — the arm nobody chose) ----------------------------
# NO INCOMING EDGE, deliberately. It does not descend from `intake`, `contract` or
# `reproduce`, because a node that descends from the intake inherits the intake's
# idea of what is broken, and that idea is exactly what the outsider did not have.
#
# The interpolation ban is the load-bearing half and it is MECHANICALLY CHECKABLE:
# this topic must contain NO `${params.issue}`, NO `${params.affected_ref}` and NO
# `${params.upstream_version}`. Not "should avoid" — must not contain, and a linter
# can grep it. A brief that names the symptom cannot un-know it; the moment the
# symptom is in the brief, the walker is walking OUR arm again and the second root is
# a first root with extra steps.
#
# It gates `release`, NOT `converge`. Deliberate: routed through the convergence, its
# findings would be answerable in the convergence's vocabulary (on-ballot /
# off-ballot / residual / no-new-information), and an unscoped execution of our own
# claims is not a review opinion to be weighed against other review opinions. It is a
# measurement of the world, and the world does not carry diversity weight.
[[spore.node]]
id          = "route"
kind        = "fixed"
formula     = "task-work"
description = "AUTHOR-INDEPENDENT INSTALL ROUTE (BLOCK, gates release): a second root with no incoming edge, forbidden from naming the issue, that installs the PUBLISHED artefact by the DOCUMENTED route on a substrate that has never run cosmon and records every deviation between what the docs promise and what happens. Unscoped execution of our own claims — not adversarial reading. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON — AUTHOR-INDEPENDENT INSTALL ROUTE (fail-closed). You have NOT been told what
anyone believes is broken, and you must not go looking for it: no issue id, no
symptom, no affected ref. That is the point of this seat, not an oversight in your
brief. If you find yourself hunting a specific defect, you are running somebody
else's arm.

Do this instead. Read the repo's PUBLISHED surfaces and nothing else — README.md, the
installation docs, `man cs`, `cs --help` — and treat every sentence in them as a
PROMISE THIS PROJECT MADE TO A STRANGER. Then be that stranger: on a substrate that
has never run cosmon (a fresh container, a fresh user, an empty HOME — never your own
warm checkout, never a worktree with a populated .cosmon/), install the PUBLISHED
artefact by the DOCUMENTED route, exactly as written, following no step the documents
do not contain. Run the first things the documents tell a newcomer to run.

Record EVERY DEVIATION between what the document promised and what happened, however
small and however obviously "just a doc bug": a command that does not exist, a flag
that was renamed, a path that is not created, a prerequisite nobody mentioned, an
error message that names an internal identifier, a step that only works if you are
root, a step that only works if you are NOT root. Deviations are the deliverable. A
run that reports no deviation is a suspicious result, not a good one: say what you
executed so a reader can judge whether you walked far enough.

Emit ${output_dir}/route.md — the substrate you used, the verbatim command sequence
you ran, and one numbered entry per deviation (promise / observed / where the document
says it) — AND ${output_dir}/surface_enumerated.json {arms[], paths[], commands[]}
declaring the surface you actually exercised, written BEFORE you interpret anything.
AND ${output_dir}/verdict.json in the §8 ADMISSION SHAPE below. FAIL-CLOSED:
a route you could not complete is BLOCKED with the step that stopped you named — never
PASS with a workaround you invented. `release` reads this verdict and cannot ship
without it.

§8 ADMISSION SHAPE — {verdict: PASS|BLOCKED, count, population, findings[],
base_sha, subject_digest, negative_control{gate_key, mutation, target,
observed_verdict, evidence_digest}}. A PASS MISSING ANY OF THESE KEYS IS
INADMISSIBLE and the consumer reads it as BLOCKED. `population` is the DENOMINATOR
you examined — here, the number of documented promises you walked; count 0 out of
population 0 is a vacuous green, not a pass. `subject_digest` hashes WHAT you
measured (the doc files + the artefact you installed, by content), so the consumer
RECOMPUTES it rather than believing you. `base_sha` is the commit THIS verdict was
computed on. YOUR NEGATIVE CONTROL: delete the documented entrypoint from the
installed prefix and re-walk — the verdict MUST flip to BLOCKED. If it does not,
this gate is colour-blind and its PASS is VOID. `gate_key` =
sha256(this topic + the commands you ran); if ${run_dir}/admissions/<gate_key>.json
exists, COPY the record forward and run no mutation (cost is O(gate edits), not
O(missions)); otherwise run it once and write it there. NO SIDE LEDGER: that file
is a cache, the record is copied INTO this verdict.json, and the consumer
recomputes `gate_key` itself — a record the consumer only reads back is the
provenance gate that printed `skip` and exited 0.
"""

