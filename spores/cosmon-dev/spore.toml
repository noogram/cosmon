§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED, count, population,
findings[], base_sha, subject_digest, negative_control{gate_key, mutation, target,
observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY IS INADMISSIBLE
(the consumer reads it as BLOCKED). `population` = the number of required evidence
fields you checked; count 0 over population 0 is a vacuous green, never a pass.
`subject_digest` = a content hash of the issue text you actually read, recomputed
by the consumer, never asserted by you. `base_sha` = the commit THIS verdict was
