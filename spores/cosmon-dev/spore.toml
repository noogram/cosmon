means the gate is colour-blind and its PASS is VOID. `gate_key` = sha256(this
topic + the script you invoked): if ${run_dir}/admissions/<gate_key>.json exists,
COPY the record forward and run no mutation (cost is O(gate edits), not
O(missions)); otherwise run it once and write it there. The record is copied INTO
this verdict.json — NO SIDE LEDGER — and the consumer recomputes `gate_key`.
"""

