\* Model 11 — #118 counterexample: a Collapsed or Frozen blocker
\* releases its dependents (PreFix "ReleaseOnAnyTerminal"). Expected:
\* DependentRunsOnlyAfterBlockerCompleted FAILS: the blocker is collapsed
\* and its dependent is then selected and spawned. One edge (StarDAG).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mol = {m1, m2}
    MaxSeqno = 1
    AsyncCrashesEnabled = FALSE
    OutOfBandEnabled    = FALSE
    T_STALL  = 99
    MaxClock = 1
    ConcurrencyEnabled = TRUE
    BlockedBy <- StarDAG
    PreFix    = {"ReleaseOnAnyTerminal"}
INVARIANTS
    DependentRunsOnlyAfterBlockerCompleted
