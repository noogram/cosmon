observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY IS INADMISSIBLE
(the consumer reads it as BLOCKED). `population` = the number of precedence rows /
promise clauses you stated; count 0 over population 0 is a vacuous green.
`subject_digest` = a content hash of the resolver source you read the promise
from, recomputed by the consumer, never asserted by you. `base_sha` = the commit
THIS verdict was computed on. NEGATIVE CONTROL: hand this gate a contract.md that
merely restates the symptom and re-run — the recorded verdict MUST flip to
BLOCKED; observed_verdict == verdict means the gate is colour-blind and its PASS
is VOID. `gate_key` = sha256(this topic + the script you invoked): if
${run_dir}/admissions/<gate_key>.json exists, COPY the record forward and run no
mutation; otherwise run it once and write it there. The record is copied INTO this
verdict.json — NO SIDE LEDGER — and the consumer recomputes `gate_key`.
"""

# --- G2 reproduce (the deterministic red; NEW formula) --------------------
[[spore.node]]
id          = "reproduce"
kind        = "fixed"
formula     = "clean-room-repro"
description = "G2 deterministic red, frozen (BLOCK): a test that fails on affected_ref for the RIGHT reason, hashed before the fix branch, write-locked, with differential refutation + false-green/false-red modes. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G2 CLEAN-ROOM REPRODUCTION on ${params.affected_ref}.
"""
