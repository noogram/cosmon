formula = "converge-clean-room"
version = 1
description = """
The §6bis DOUBLE clean-room review loop of the `cosmon-dev` spore — iterate a
provider-diverse two-engine review until BOTH engines return CLEAN in the same
round, or `blocked` + human escalation at `max_rounds`. It replaces the DAG's
G6 (breaker+dissent) and G7 (judge chambre-blanche) with ONE auto-conducted
convergence loop (blueprint §6bis).

REUSE, DO NOT REINVENT — this formula is PURE WIRING over two existing primitives:
  * `while`  (../../../.cosmon/formulas/while.formula.toml) — the iterate-until-
    condition loop. Its `max_iterations` cap IS our `max_rounds` (a FATAL cap, not
    a benign exit). We do NOT re-implement the loop; we drive `while` with a
    condition_check that reads the two verdict.json.
  * `cross-provider-committee` (../../../.cosmon/formulas/cross-provider-committee.formula.toml,
    ADR-147) — the jury that is provider-diverse BY CONSTRUCTION (adapter-pinned
    seats). Each round nucleates ONE committee whose seats are CHOSEN AGAINST the
    generator's family (see THE ROSTER IS AN OUTPUT below). We do NOT re-implement
    the seat DAG or the diversity witnesses; we convene a committee per round.
NEVER a deep-think panel: N claude personas share weights/policy/framing ->
"rationalisation collective deguisee en debat" (janis). A→A is an echo, not a
witness. A bloc of one family counts for ONE voice, however many seats it fills.

THE ROSTER IS AN OUTPUT, NOT A CONSTANT (measured, converge-20260727-a302).
This formula used to hard-code `claude + codex-sol`. In a galaxy whose default
adapter is claude, the fix molecule under audit is tackled `--adapter claude`, so
its registered Incarnation is anthropic — and the committee kernel then rejects
the claude SEAT as a FamilyCollision: same resolved endpoint tuple as the
generator it audits. Of the two seats the recipe named, only ONE ever bore the
diversity floor. A conjunctive CLEAN-and-CLEAN door over that roster READS as two
independent families while being, structurally, one family plus one
non-floor-bearing reader. It is not the kernel that is wrong — plan_committee did
exactly the right thing — it is the RECIPE that named a roster the kernel must
reject half of, and then said nothing about what to do with the rejected seat.
So: READ the generator's family FIRST, then pick seats so that EVERY seat's
family differs from the generator's AND from each other's. Never hard-code the
pair. See `RosterPlan::floor_bearing_seats` /
`floor_is_single_point_of_failure` — the seat COUNT cannot tell "two families"
from "one family plus a reader"; only the floor-bearing set can.

THE ROUND (3+ nodes, nucleated FORWARD each iteration):
      artefact courant
      ├──> review-seat-1 (family != generator's)  ─┐
      └──> review-seat-2 (family != generator's    ─┤
                          AND != seat-1's)          v
                                                 converge-check
                               CLEAN and CLEAN ? ──yes──> verdict CLEAN, debloque l'aval
                                    │
                                   no -> cs nucleate: fix(UNION of the 2 reports)
                                          -> review-seat-1 || review-seat-2 -> converge-check' (round n+1)
                                          (all --blocked-by the current converge-check)

CLEAN = CONJUNCTION over a jury that ACTUALLY SAT. Both engines must return CLEAN
in the SAME round. A single FINDINGS is NOT-CLEAN -> next round. The `fix`
corrects the UNION of the two reports (a finding either engine raised). But a
seat that could not execute is NEVER CLEAN and never silently absent: see A SEAT
THAT DID NOT REVIEW below.

A SEAT THAT DID NOT REVIEW (the mid-review provider refusal).
Measured twice in two days: a seat's provider refused the work partway through on
cybersecurity policy, and the operator switched the model from inside the pane to
let it continue. A provider-diverse jury that needs a human at every round is not
automatic, and a SILENT human rescue is the worst outcome of all three available
— it leaves no trace that the jury needed rescuing. The rule:
  1. Classify every seat's DELIVERY, separately from its verdict: delivered /
     provider-refusal / stalled / not-dispatched. "Looked and could not decide"
     and "was never allowed to look" are different facts; collapsing them is how
     a jury silently shrinks.
  2. Re-check the floor on the DELIVERING seats plus the generator
     (`cosmon_core::committee::fold_committee`). If they no longer span the jury
     floor, the round is INCONCLUSIVE — never CLEAN, and NOT a plain FINDINGS
     either (there is no jury to have found anything).
  3. An INCONCLUSIVE round does NOT consume a `max_rounds` slot on the quality
     axis: it is a jury failure, not a quality failure. Record it in rounds.md
     with the refusing seat and its provider reason, then either re-convene with
     a seat drawn from ANOTHER family that keeps the floor intact, or — if no
     such family is wired — collapse `blocked` naming the refusal. Do NOT retry
     the same seat silently, and do NOT let a human switch it in-pane without the
     switch appearing in rounds.md.
  4. Cap re-convocations (2) so a repeatedly-refusing provider blocks loudly
     instead of looping.

SPECIFIED IS NOT REALIZED. When a seat is re-pointed mid-round, the roster keeps
reporting the model that was SPECIFIED while a different one answers. The
diversity floor is a claim about WHAT ANSWERED, never about what was configured,
so rounds.md MUST carry the realized adapter+model beside the specified one for
every seat, THE GENERATOR INCLUDED (`cs observe` renders it as `pin~>realized`;
a bare pin with no realized id is an UNCONFIRMED seat, not a confirmed match).
The seat that PROPOSES is scored on the same terms as the seats that read: it
seeds the reference family, so an unwatched generator holds up no part of the
floor either. If a seat's realized
family collapses onto the generator's or a peer's, the floor is not met however
the roster reads — that is rule 2 above, and it is why the check runs on the
realized tuple.

An UNCONFIRMED seat carries NO PART of the floor. A bare pin is not a quiet
"same as rostered"; it is a family nobody can vouch for, and counting it would
turn absence of evidence into evidence of diversity. Where the observed seats
alone do not span the floor, the round is INCONCLUSIVE — the same door a seat
that could not execute goes through.

PROVIDER DIVERSITY BUYS ERROR-INDEPENDENCE, NOT COVERAGE — brief for it
separately. Measured in round 3 (2026-07-28): the critical finding of the whole
convergence was found by the SAME-FAMILY reader, the seat carrying zero
diversity weight. The floor-bearing cross-family seat AND the driver both
verified the same fix by replaying the author's own scenario, and both passed it.

Two seats on distinct families will not make the same MISTAKE about what they
read. Nothing about their families stops them READING THE SAME PLACE — and
replaying the author's scenario is the place every seat drifts toward, because
the artefact hands it to them. A jury that is diverse in provider and identical
in itinerary is one reader with error bars.

So the convener owes each seat a DISTINCT ENTRY POINT, named in the brief and
recorded in rounds.md beside its family:
  * one seat replays the author's own scenario (the control — it must exist, or
    nobody checks the claim as made);
  * at least one enters from the OPPOSITE end: the state the fix says cannot
    happen, the input the test fixture never constructs, the branch reachable
    only when the artefact is ABSENT rather than wrong;
  * at least one reads the gate as an ADVERSARY of its author: not "is this
    right?" but "what would I have to write for this to pass while lying?".
Two seats reporting the same entry point is the same finding twice, whatever
their tuples say — record it as one, and re-brief.

This is a briefing rule, not a scoring rule: entry-point distinctness is not
folded into the diversity floor and does not gate convening. The floor stays
what it is (resolved-endpoint distinctness, ADR-147); this sits beside it, and
saying it out loud in the brief is the whole intervention. Making it a
countable requirement would be a second self-attested axis — a convener writing
"distinct entry points: yes" — which is the exact defect class round 3 spent
itself closing.

A SIBLING SWITCH IS INVISIBLE TO THE TUPLE. The recurring case is not a family
change: `gpt-5.6-sol` stalls on a provider guardrail and the seat is re-pointed
at `gpt-5.6-terra` — same provider, same base_url, same family, identical tuple.
Three times in two days on one seat, which makes it the normal operating
condition and not an edge path. So rounds.md records the realized MODEL, and
records the fact that a human re-pointed the seat after dispatch, as two
separate facts: a switch back to the rostered pin changed nothing measurable
and is still a rescue. A round that needed hands is NEVER an intact jury, and a
jury that is not intact may REFUTE but may NEVER CERTIFY: its verdict is
INCONCLUSIVE, whatever the floor arithmetic says. Recording the rescue and then
certifying anyway is the failure this clause closes — a caveat the operator
cannot act on is not a control. The four conditions are all of: floor met on
what ANSWERED, every roster seat delivered, every realized endpoint observed
(the generator's included — it is not a special case), and no hand in any pane.

ACYCLICITY BY INITIALISATION. There is never a cycle: germinating round 1 is the
INITIALISATION. Each NOT-CLEAN nucleates FORWARD (fresh ids, `--blocked-by` the
current converge-check) -> a strictly acyclic temporal chain. `cs run --resident`
absorbs the descendants nucleated mid-run (ADR-038); the auto-parent contract
`COSMON_PARENT_MOL_ID` wires the new round to this molecule.

TERMINATION + GARDE-FOU. Converge when both are CLEAN (the quality fixpoint). At
`max_rounds` exhaustion: NEVER a silent pass -> state `blocked` + human escalation
(NOT-CONVERGED blocks like NOT-RUN). `molecule_quota_exceeded` (exit 91) is the
runaway backstop. The `while` collapse on `max_iterations` is the mechanical
enforcement of this cap.

FAIL-CLOSED VERDICT CONTRACT (codex-sol #28). Each reviewer emits BOTH:
  * referee-report.md — human-readable; first line `VERDICT: CLEAN` |
    `VERDICT: FINDINGS (N)` | `VERDICT: INCONCLUSIVE`, then {line, quote, fix}
    per severity;
  * verdict.json sidecar — {verdict: "CLEAN"|"FINDINGS"|"INCONCLUSIVE", count,
    findings:[...]}.

TWO VOCABULARIES, ONE MAPPING — read this before writing any reader.
A seat convened through `cross-provider-committee` is a **cmb-verify** molecule,
and cmb-verify's own verdict-door speaks {confirmed | refuted | inconclusive}
while this contract speaks {CLEAN | FINDINGS | INCONCLUSIVE}. A seat therefore
legitimately emits BOTH.

THIS TABLE IS A CONSUMER, NOT A DEFINITION. `cmb-verify.formula.toml`, step
`verify-or-refute`, DEFINES the door; this file consumes it. Where the two ever
disagree, cmb-verify wins and this file is the bug — which is not hypothetical:
until 2026-07-28 this table stated the committee polarity as if it were
unconditional, and a seat reproducing a defect would have been filed CLEAN.

`confirmed` DOES NOT MEAN "GOOD". It means THE STATED MECHANISM HOLDS, and
whether that is good news depends on what the stated mechanism claimed — which
is an INPUT to the seat, not something a reader can infer. So cmb-verify's
verdict.json carries a required `mechanism_polarity` field, and the mapping is
read through it:

  polarity   cmb-verify      this contract   means
  --------   -------------   -------------   -----------------------------------
  fix        confirmed       CLEAN           the audited fix holds; nothing found
  fix        refuted         FINDINGS        a falsifier went red
  defect     confirmed       FINDINGS        the claimed defect REPRODUCES
  defect     refuted         CLEAN           the claimed defect is not there
  either     inconclusive    INCONCLUSIVE    no verdict was reachable

A seat convened by this loop is ALWAYS `polarity: fix` — it audits a shipped
fix, never a bug report. So for a seat, `VERDICT: FINDINGS (2)` beside `REFUTED`
is AGREEMENT, not contradiction: one round observed exactly that pair and it read
as a seat contradicting itself.

BUT THAT SENTENCE IS A DECLARATION, NOT A GUARANTEE, so do not lean on it. It
says what a seat OUGHT to be; nothing about the sentence makes a seat write the
field, or write it truthfully. The question that governs this whole lineage is
*can the gate still pass when the constrained party lies, or is simply absent?*
— and for a rule that lives only here, the answer is yes. So the polarity is
read by code: `cosmon_core::committee::read_seat_emission` maps the triple and
refuses a missing field or an off-table row, and `cs reconcile --check` runs it
over the seats on disk (`check_seat_verdict_polarity`). Reading this paragraph
is not enough; run the gate.

THE READER MUST REQUIRE AN AFFIRMATIVE `CLEAN` IN BOTH FILES, and must never
infer clean from the ABSENCE of FINDINGS. `verdict != "FINDINGS"` reads REFUTED
as clean — the exact shape this whole contract exists to refuse — and so does
`not report.contains("FINDINGS")`. Clean is a thing a seat says, not a thing a
reader fails to find. Where a seat emits cmb-verify's vocabulary instead, map it
through the table above and require the pair that lands on CLEAN; anything not
on the table is NOT-CLEAN.

AND THE RESIDUAL THE BOTH-FILES RULE DOES NOT CLOSE: requiring an affirmative
CLEAN in both files still passes a seat that emits `confirmed` AND
`VERDICT: CLEAN` together while its polarity is `defect` — i.e. a seat saying
"the defect reproduces" and "nothing found" in one breath. Two files agreeing is
not two files being right. So the reader ALSO requires that the pair be
CONSISTENT under the seat's stated polarity: a verdict.json with NO
`mechanism_polarity`, or a (polarity, verdict, VERDICT) triple that is not one
row of the table above, is NOT-CLEAN. Fail closed on the missing field rather
than assuming the polarity that makes the round pass — assuming is how this
defect was introduced in the first place.

The converge-check reads the TWO verdict.json and FAIL-CLOSES if either is absent
or malformed (a gate that cannot fail is not a gate).

review_scale: `mission` => one loop wraps the whole deliverable (the oxymake
style). `submission` => each gate/sub-mission carries its own nested loop.

VARIABLES:
  - topic        : the convergence task (the spore interpolates the issue).
  - issue        : the reported defect id (for briefing the reviewers).
  - max_rounds   : the hard cap (default 5) -> `while` max_iterations.
  - risk         : normal | release | security -> the committee jury floor.
  - review_scale : mission | submission.

ARTIFACT PATHS — all artifacts (rounds.md, converge-verdict.json, per-round
referee-report.md + verdict.json) MUST be written to the RUN-SCOPED OUTPUT HOME
germination hands this node in the `output_dir` variable (`${output_dir}` =
`<state>/spore-runs/<germination-id>/converge/`, ADR-161). MOLECULE_DIR below is
that handed `${output_dir}`. NEVER the worktree (destroyed by `cs done`), NEVER
the spore definition tree, NEVER the repo root (F9).
"""
id_prefix = "converge"
freeze_on_last_step = false

[vars.topic]
description = "The convergence task, stated in one or more sentences."
required = true

[vars.issue]
description = "The reported defect id — briefs the two review engines."
required = true

[vars.max_rounds]
description = "Hard cap on convergence rounds -> `while` max_iterations. Exhaustion is `blocked` + escalation, never a silent pass."
default = "5"

[vars.risk]
description = "normal | release | security — drives the cross-provider-committee jury floor (normal=2 families, release/security=>=3, conjunctive)."
default = "normal"

[vars.review_scale]
description = "mission (one loop wraps the deliverable) | submission (each gate carries its own nested loop)."
default = "mission"

# Tier 1 — this is the ONE non-Tier-0 node of the spore: it nucleates children
# (fix + two review seats + a converge-check) FORWARD each round. `measure =
# "iterations"` is the finite bound = max_rounds, declared up front; the `while`
# max_iterations cap enforces it and a future verifier reads rounds.md to confirm
# the loop terminated within bound.
[tier]
level = 1
measure = "iterations"

[[steps]]
id = "init-round-1"
title = "Initialise: convene round 1 (the loop initialisation, not a cycle)"
description = """
MOLECULE_DIR is the run-scoped `${output_dir}` germination handed you (ADR-161) —
NEVER the worktree, NEVER the spore definition tree, NEVER the repo root.

Germinating round 1 IS the initialisation (acyclicity by construction). Set up the
loop ledger and convene the first committee.

  1. Parse ${max_rounds} (default 5). Create MOLECULE_DIR/rounds.md with a header:
       | round | fix_id | seat-1 (family) | seat-2 (family) | delivery | realized | clean? |
     and record the artefact under review (the ci-gate-passed fixed tree).
  2. READ THE GENERATOR'S FAMILY BEFORE CHOOSING SEATS. The artefact under review
     was produced by some molecule tackled under some adapter; read that
     molecule's registered Incarnation and resolve its endpoint tuple — never
     assume the galaxy default, and never assume it is NOT the default either.
     That family is the axis both seats must differ from. Choosing `claude +
     codex` blind is exactly the defect this step exists to prevent: in a
     claude-default galaxy the claude seat is a FamilyCollision the kernel
     rejects, leaving the entire floor on codex alone.
  3. Convene the round-1 committee by nucleating cross-provider-committee — do NOT
     re-implement the seats. The committee is the double clean-room review:
       cs nucleate cross-provider-committee \\
         --decayed-from {this_mol_id} --tag temp:warm --tag converge-round:1 \\
         --var target="<the fixed tree / the implement molecule id>" \\
         --var symptom="${issue} — audit the fix as ARTEFACTS, not testimony" \\
         --var stake="<normal->root | release/security->max>"
     The committee's roster enforces provider diversity on the RESOLVED endpoint
     (not the adapter NAME). Pass it seats whose families ALL differ from the
     generator's and from each other's, so that NO single seat carries the whole
     floor (`floor_bearing_seats` empty at floor 2 = symmetric). At risk
     security/release the jury floor is >=3 distinct families, conjunctive — and
     the same collision would eat one of those three, so read the generator
     family there too.
     If only one non-generator family is wired, you MAY convene the fragile
     one-bearer roster, but rounds.md MUST record `floor_is_single_point_of_
     failure = true` and the driver MUST treat a refusal of that seat as
     INCONCLUSIVE, never CLEAN.
  4. Each seat MUST emit the fail-closed verdict contract: referee-report.md (first
     line `VERDICT: CLEAN` | `VERDICT: FINDINGS (N)`) AND verdict.json sidecar
     {verdict, count, findings:[{loc,quote,fix,severity}]}. Inject that contract
     into each seat's briefing (the committee's dispatch-seats step does the
     injection; record the contract_hash). The brief MUST require both files to
     be written on the seat's FIRST step and updated incrementally — a contract
     deferred to a final summarising turn is lost entirely to a provider refusal
     or a sleeping machine.

Write rounds.md row for round 1 with the committee id, the two seat ids, each
seat's resolved family, and the generator family they were chosen against.
"""
acceptance = "MOLECULE_DIR/rounds.md initialised with the header and the round-1 committee (a cross-provider-committee nucleation, NOT a reimplemented panel). The generator's family was READ from the artefact's registered Incarnation and recorded, and the seats were chosen so their families differ from it and from each other — never a hard-coded claude+codex pair. When only one non-generator family was wired, rounds.md records floor_is_single_point_of_failure = true. Each seat is bound to the referee-report.md + verdict.json fail-closed contract, written on its first step and updated incrementally. The stake maps risk->jury floor. Round 1 is the initialisation, wired --decayed-from this molecule."

[[steps]]
id = "loop-until-clean"
title = "Iterate the double review until CLEAN and CLEAN, or block at max_rounds"
description = """
Drive the loop with the `while` discipline (../../../.cosmon/formulas/while.formula.toml)
— do NOT re-implement it. The condition is "not (CLEAN and CLEAN)"; the body is
"fix(union) + reconvene the two-engine committee".

Pseudocode (round = 1 already convened by init):
    while round <= max_rounds:
        wait for BOTH seats of the current round to reach terminal (cs wait)
        # (a) LIVENESS BEFORE OPINION. Classify each seat's DELIVERY first —
        # delivered / provider-refusal / stalled / not-dispatched — from its
        # terminal state and its pane, and record the REALIZED adapter+model
        # beside the specified one (`cs observe` renders drift as `pin~>real`).
        # A seat that could not execute has no opinion to read.
        # (b) RE-CHECK THE FLOOR ON WHO ACTUALLY SAT. Count distinct families
        # over the generator + the DELIVERING seats, on their REALIZED tuples.
        if delivered_families < jury_floor:
            # No jury. Not CLEAN, and not FINDINGS either — there is nobody to
            # have found anything. This is the case that used to silently pass.
            record INCONCLUSIVE in rounds.md with the seat, its delivery reason,
              and its provider's stated refusal, verbatim
            if reconvocations < 2 and another family is wired that keeps the
               floor intact:
                re-convene THIS round with that family (do NOT advance `round`;
                a jury failure is not a quality failure and must not consume a
                max_rounds slot), reconvocations += 1; continue
            cs collapse {this_mol_id} --reason "converge: jury vacated by
              <seat> (<delivery reason>); no further family wired" ; break
        read each delivering seat's verdict.json
        # FAIL-CLOSE (codex-sol #28): either absent/malformed => treat as FINDINGS,
        # never CLEAN. A missing verdict is NOT a pass.
        if any delivering seat's verdict.json is absent or malformed:
            record NOT-CLEAN (reason: missing/malformed verdict), continue to fix
        # AFFIRMATIVE CLEAN, in BOTH files, from EVERY delivering seat — and
        # the pair CONSISTENT under that seat's stated `mechanism_polarity`.
        # A seat speaking cmb-verify's vocabulary is mapped THROUGH ITS
        # POLARITY, never directly: `confirmed` reads CLEAN only under
        # polarity `fix`; under polarity `defect` the same word reads FINDINGS
        # (the defect REPRODUCES). Take the row from the header's table.
        # NEVER `verdict != "FINDINGS"` and never "the report does not mention
        # FINDINGS": both read REFUTED as clean, the failure this contract
        # exists to refuse.
        for each delivering seat:
            polarity = its verdict.json `mechanism_polarity`
            if polarity is absent, or is neither "defect" nor "fix":
                # FAIL CLOSED on the missing field. The door is relative and no
                # reader may pick the polarity that makes the round pass.
                record NOT-CLEAN (reason: verdict unreadable — no polarity)
                continue to fix
            mapped = header_table[polarity][its cmb-verify verdict]
            if mapped != the `VERDICT:` word on referee-report.md's first line:
                # The agreeing-but-wrong pair. Two files agreeing is not two
                # files being right.
                record NOT-CLEAN (reason: (polarity, verdict, VERDICT) off-table)
                continue to fix
        clean = every delivering seat MAPPED to CLEAN AND wrote `VERDICT: CLEAN`
                on referee-report.md's first line
                # conjunctive over seats AND over the two files
        # This loop body is `cosmon_core::committee::read_converge_round`, and
        # `cs reconcile --check` runs it over the seats on disk
        # (`check_seat_verdict_polarity`): it REFUSES a seat whose polarity is
        # missing and a triple that is not one row of the table. Run it — a
        # rule only a worker reads is a rule a worker can forget.
        append rounds.md row with both verdicts, delivery, realized model, clean?
        if clean:
            break                       # the quality fixpoint — natural exit
        if round == max_rounds:
            # exhaustion — NEVER a silent pass
            cs collapse {this_mol_id} --reason "converge: max_rounds exhausted, NOT-CONVERGED"
            # or emit blocked + escalate; NOT-CONVERGED blocks like NOT-RUN
            break
        # NOT-CLEAN and rounds remain: nucleate the next round FORWARD (acyclic)
        fix_id = cs nucleate task-work --kind task \\
                   --decayed-from {this_mol_id} --tag temp:warm \\
                   --tag converge-round:<round+1> \\
                   --var topic="Fix the UNION of the two referee reports of round
                   <round> for ${issue}: address every finding either the claude
                   seat OR the codex-sol seat raised. Smallest patch; keep the
                   frozen red green; keep the domain I/O-free."
        # blocked-by the current converge state so the chain stays strictly forward
        committee_id = cs nucleate cross-provider-committee \\
                   --blocked-by fix_id --decayed-from {this_mol_id} \\
                   --tag temp:warm --tag converge-round:<round+1> \\
                   --var target="<fix_id>" --var symptom="${issue}" \\
                   --var stake="<risk-derived>"
        round += 1

MANDATORY (same discipline as `while`):
  1. Every nucleation carries `--decayed-from {this_mol_id}` (typed lineage) and
     `--tag converge-round:<n>` (auditability). `cs run --resident` absorbs them.
  2. NEVER advance a round while the previous review is still running — `cs wait`
     first. Parallel rounds would break the acyclic-forward invariant.
  3. NEVER skip the max_rounds check — a runaway loop is the primary safety hazard;
     the `while` cap + exit 91 are the backstops.
  4. A missing verdict.json is NOT-CLEAN, never CLEAN (fail-closed). So is a
     verdict.json whose value is not an affirmative CLEAN — including one that
     simply is not "FINDINGS". A seat speaking cmb-verify's door counts as
     affirmative ONLY when its `mechanism_polarity` is stated and the
     (polarity, verdict, `VERDICT:`) triple is one row of the header's table:
     `confirmed` reads CLEAN under polarity `fix` and FINDINGS under polarity
     `defect`. A missing polarity is NOT-CLEAN — never the polarity that makes
     the round pass. `cs reconcile --check` refuses both shapes.
  5. A seat that did not DELIVER carries no family and no verdict. If the
     delivering seats no longer span the jury floor, the round is INCONCLUSIVE —
     never CLEAN. A human switching a refusing seat's model from inside the pane
     is only acceptable when the switch is written into rounds.md as a
     re-convocation; a silent rescue is forbidden precisely because it leaves the
     record saying the jury was intact when it was not.

review_scale=submission: run this loop PER gate/sub-mission instead of once over
the whole deliverable — the loop body is identical, only the `target` scope narrows.
"""
needs = ["init-round-1"]
acceptance = "MOLECULE_DIR/rounds.md records every round with each seat's verdict, its DELIVERY disposition, its realized model beside the specified one, and the clean? flag. Every round where the delivering seats no longer spanned the jury floor is recorded INCONCLUSIVE — never CLEAN and never a plain FINDINGS — with the refusing seat and its provider's stated reason verbatim, and either a recorded re-convocation under another family (which did NOT consume a max_rounds slot) or a `blocked` collapse naming the refusal. No seat was rescued in-pane without the switch appearing in rounds.md. The loop exits naturally when every delivering seat returns CLEAN in one round over a jury whose delivering seats spanned the floor on OBSERVED endpoints — a recorded hand-rescue does not block that exit, it only forbids the round from being described as an intact jury, or COLLAPSES/BLOCKS at max_rounds or on a vacated jury (never a silent pass). Each not-clean round nucleated a fix(union) + a fresh committee FORWARD (--decayed-from, --blocked-by), strictly acyclic. A missing/malformed verdict.json was treated as NOT-CLEAN. `while` was driven, not reimplemented."

[[steps]]
id = "emit-converge-verdict"
title = "Emit the fail-closed convergence verdict"
description = """
Fold the loop into the machine-readable verdict the release gate reads.

Write MOLECULE_DIR/converge-verdict.json:
  {
    "verdict": "CLEAN" | "BLOCKED",
    "rounds_run": <k>,
    "reconvocations": <r>,
    "max_rounds": ${max_rounds},
    "exit_reason": "clean-fixpoint" | "max-rounds-exhausted" | "jury-vacated",
    "generator_family": "<the family the seats were chosen against>",
    "floor_bearing_seats": [ "<seat ids that actually held the floor>" ],
    "floor_is_single_point_of_failure": true | false,
    "final_round": {
      "<seat_id>": {
        "verdict": "CLEAN" | "FINDINGS" | "INCONCLUSIVE",
        "delivery": "delivered" | "provider-refusal" | "stalled" | "not-dispatched",
        "specified_model": "<pin>",
        "realized_model": "<what answered>" | null
      }
    },
    "findings_history": [ per-round {round, per_seat, union_count, delivered_families} ]
  }

verdict "CLEAN" iff the loop reached the fixpoint within max_rounds — EVERY seat
CLEAN in the final round AND that round's DELIVERING seats spanning the jury
floor. A round whose jury fell below the floor is INCONCLUSIVE and can never be
the CLEAN final round, however the surviving seats read. Exhaustion => "BLOCKED"
with exit_reason "max-rounds-exhausted"; a jury vacated by refusals with no other
family wired => "BLOCKED" with exit_reason "jury-vacated", naming the refusing
seat and the provider's stated reason. Both carry an escalation note for the
human. FAIL-CLOSED: a missing or malformed converge-verdict.json is read by the
release gate as BLOCKED.

`floor_is_single_point_of_failure = true` on a CLEAN verdict is not a
contradiction, but it IS a caveat the release gate must see: the run converged on
a jury whose diversity rested on one seat, so its CLEAN is worth exactly one
family's error-independence plus one reader's.

Also write MOLECULE_DIR/synthesis.md: the round-by-round trace (blueprint §6bis),
the two substrates that had to both sign CLEAN, and — if blocked — the exact
findings that never converged (for the human escalation).
"""
needs = ["loop-until-clean"]
acceptance = "MOLECULE_DIR/converge-verdict.json written with verdict/rounds_run/reconvocations/max_rounds/exit_reason/generator_family/floor_bearing_seats/floor_is_single_point_of_failure/final_round/findings_history, where each final_round seat carries its verdict, delivery disposition, specified model and realized model. CLEAN only when every seat returned CLEAN within max_rounds AND that round's delivering seats spanned the jury floor; a jury below its floor is INCONCLUSIVE and can never be the CLEAN final round. Exhaustion is BLOCKED (max-rounds-exhausted); a jury vacated by refusals with no further family wired is BLOCKED (jury-vacated) naming the seat and the provider's reason. Never a silent pass. synthesis.md carries the round-by-round trace including every non-delivery and every specified~>realized drift."
