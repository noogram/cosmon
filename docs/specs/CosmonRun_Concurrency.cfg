\* Model 8 — the 2026-09-29 concurrency situations, all fixes in place.
\*
\* Two molecules with one blocked-by edge (BlockedBy <- StarDAG), two
\* tacklers (operator, resident runtime) racing for dispatch, the patrol
\* auto-collapse with spawn grace, re-tackle of a Running molecule whose
\* worker died, and async crashes (ProcessCrash is the codex self-update
\* that ends a pane, #122).
\*
\* Expected: every listed invariant holds. I3/I4 are omitted because
\* async crashes break them by design (see CosmonRun_CrashesI3/I4).
\* Each of the four new invariants has a counterexample config that
\* re-enables one pre-fix behaviour through PreFix and must fail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mol = {m1, m2}
    MaxSeqno = 1
    AsyncCrashesEnabled = TRUE
    OutOfBandEnabled    = FALSE
    T_STALL  = 99
    MaxClock = 1
    ConcurrencyEnabled = TRUE
    BlockedBy <- StarDAG
    PreFix    = {}
INVARIANTS
    TypeOK
    I6_NoGhostFleetEntry
    I7_SingleEventWriter
    I9_BranchMergedOnlyIfCompleted
    PurgeNeverCollapses
    NoCollapseOfLiveOrGraceWorker
    DependentRunsOnlyAfterBlockerCompleted
    OneDispatchPerMolecule
    NoWriterOverwritten
