id = "cosmon.client"
name = "Cosmon — Client integrations"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Native Cosmon views; read-only default and explicit Interagir"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open Cosmon selector"
contexts = ["workspace"]
command = ["python3", "cosmon-herdr.py", "launch"]

[[panes]]
id = "selector"
title = "Cosmon selector"
placement = "tab"
command = ["python3", "cosmon-herdr.py", "select"]
