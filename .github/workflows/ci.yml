name: CI

# All third-party Actions pinned by 40-char commit SHA (delib-20260425-39c1).
# Tag-mutable references (@v4, @stable, @v2) are FORBIDDEN — re-pin via
# `gh api repos/<owner>/<repo>/git/refs/tags/<tag>` before bumping.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  sovereignty:
    name: Sovereignty gate (avatar-tenant-demo bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      # Post-merge backstop over the customer-traveling dist/avatar-tenant-demo/
      # bundle (also wired into build.sh + handoff.sh, on the same git-tracked
      # byte-set). Three mechanisms (spec: scripts/sovereignty-spec.md, authored
      # by the rounds 3-5 review panel):
      #  1. DENY-class (hard, fails CI) — shaped classes + known-identity
      #     literals: molecule ids, branch/worktree names, tailnet hosts,
      #     operator paths, emails, dates, IPv4, the known operator/fund/galaxy
      #     names.
      #  2. RESOLVABILITY (hard, fails CI) — the generative rule that replaced
      #     the old per-shape citation classes (ADR/§ → source paths → bead
      #     codes, each chased one round late): every path-like/citation-like
      #     reference MUST resolve to a bundle file, a public URL, or a public
      #     standard; a dangling pointer into cosmon's private corpus is denied
      #     the moment it appears, whatever its next lexical shape.
      #  3. WARN (advisory) — unknown vocabulary absent from
      #     scripts/sovereignty-allowlist.txt, the net for the NEXT proper noun.
      - run: ./scripts/sovereignty-gate.sh

  confidentiality:
    name: Confidentiality banlist (publishable surface)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      # Operator/fund identity tripwire ([B1′: R5], B1′ doc-modernization plan
      # §6-P0). Hard gate over the PUBLISHABLE surface only — the rendered mdBook
      # source (docs/book/src/), README, LICENSE/NOTICE, i.e. exactly the byte-set
      # that becomes the public docs.noogram.org site + the public repo front matter.
      # Clean today; a RE-LEAK of an operator/fund term onto that surface fails CI.
      # The whole-repo audit (`--whole-repo`) covering the INTERNAL corpus (ADRs,
      # lore) is intentionally NOT wired here: it is the pre-public-flip gate the
      # operator runs before the scrub (§6-P5), and would false-red the private
      # repo's own legitimate internal history. Promote it to a hard gate only
      # AFTER that scrub lands. Single source of the banlist: the script itself.
      - run: ./scripts/confidentiality-banlist.sh
      - run: ./scripts/confidentiality-banlist.test.sh

  docs-one-gate:
    name: Docs one-gate (tool surface = stranger-installable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      # The "one gate" docs-lint (ADR-149 §4 / ADR-126, delib-20260711-8d00 C4).
      # A public doc surface for a tool — a nav title, a section heading, or a
      # /<tool>/install.sh endpoint — exists IFF a stranger can install it
      # (public repo + release artifact). One rule, two constraints: it fails on
      # the confidential neurion PRODUCT surfacing as a section/nav/endpoint
      # (anti-leak) AND on a premature tool acquiring an install endpoint before
      # it ships (anti-vaporware). Complementary to the confidentiality banlist
      # above (which bans operator/fund IDENTITY terms). Hard on every PR; pure
      # bash + git grep over docs/book/src. Single source of the tool
      # classification: the script itself.
      - run: ./scripts/check-docs-one-gate.sh
      - run: ./scripts/check-docs-one-gate.test.sh
      # Local targets and heading fragments are a hard, offline review gate.
      # Remote probes only warn: external availability is not reproducible CI
      # state, but a dead URL or a specific path redirected to a site home is
      # still surfaced for the reviewer.
      - run: ./scripts/check-book-links.sh
      - run: ./scripts/check-book-links.test.sh

  publish-membrane:
    name: Publish membrane (runtime state · credentials · machine paths · binaries)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # The gate audits the TRACKED tree, and check C reads symlink blobs —
          # both need real git history, not a synthesised single-commit tree.
          fetch-depth: 0
      # `CLAUDE.md` has ordered `scripts/publish.sh --check` for release-bound
      # changes since the contributor guide existed; the file never did, so the
      # sentence guarding the public projection named a property nobody
      # measured. It now exists and runs on every PR — because the two clauses
      # it owns (credentials, machine paths) are exactly the ones the other
      # referees cannot gate here: release-checklist.sh GATE 1 needs gitleaks
      # installed and GATE 4 needs the operator's private denylist, and a bare
      # CI checkout has neither, so both honestly PEND. This one needs nothing
      # but git and python3 and is therefore hard.
      - run: ./scripts/publish.sh --check
      # A green gate proves the scanner ran, not that it can red. The test
      # constructs a real violating repository per rule and fails unless the
      # gate exits non-zero AND names the offending path.
      - run: ./scripts/publish.test.sh
      # The provenance guard the nonroot-pilot bench stamps its images with
      # shipped unfalsified: removing the post-build re-check reddened nothing.
      # This constructs both ways a tree can move mid-build and asserts the
      # bench still calls the guard AFTER the build, not only before it.
      - run: ./scripts/source-provenance.test.sh
      # `just install` runs unattended after every harvest via
      # `[hooks].post_merge`, so the hook installer must never replace a
      # developer's local hook — it installs a missing one, accepts an
      # identical one, and refuses a differing one. The refusal is the whole
      # point and a refusal nothing exercises cannot fire: this test was
      # confirmed to go red (3 of 8, including "IT WAS OVERWRITTEN") against
      # the announce-then-overwrite version it replaced.
      - run: ./scripts/install-hooks.test.sh
      # The crossing no longer sits on the daily path — merges land on the
      # trunk directly since linear history was dropped — but the script is
      # kept for the exceptional scrubbed projection, and a kept tool with no
      # test is the rot this file exists to prevent. Its value is entirely in
      # what it REFUSES: a dirty tree (which would ship the previous commit's
      # content and exit green), two trunks that disagree, a waiver the
      # candidate introduces, a red publish gate, and a run whose audited
      # worktree is not the one it crosses from. Hermetic: temp-dir fixture
      # repos with a local bare remote, no network, no key — so keeping it
      # costs seconds, and dropping it would leave 1190 lines unwatched.
      - run: ./scripts/release/crossing.test.sh

  fixture-independence:
    name: Fixture independence (tautological-fixture tripwire)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      # Tautological-fixture tripwire (delib-20260710-95a7 §Q6, DoD gate a). A
      # fixture that re-derives its expected value from size_of/align_of/offset_of
      # of the type under test is a tautology — a layout bug flows into both sides
      # of the assert, so reverting the bug cannot redden the test. Fast, pure
      # bash+git grep over the tracked test surface; hard on every PR (reuses the
      # B2 command-gate mechanism, no cosmon-core change). Single source of the
      # rule + opt-out marker: the script itself.
      - run: ./scripts/check-fixture-independence.sh
      - run: ./scripts/check-fixture-independence.test.sh

  mutation-falsifier:
    name: Mutation falsifier (nightly, advisory)
    # DoD gate b — the "reverting the fix must redden the test" gate
    # (delib-20260710-95a7 §Q6). Mutation testing is SLOW (ADR-010:177): it
    # rebuilds the workspace once per mutant. It therefore runs ONLY on the
    # nightly cron, NEVER on the PR fast lane, and NEVER as a hard-abort
    # (feynman) — `continue-on-error` makes a surviving mutant a reported test
    # hole, not a red merge gate. Scoped to cosmon-core (the 90%-coverage,
    # invariant-heavy crate) to stay bounded; widen via --package / --whole-tree
    # as CI capacity allows.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Falsifier preflight (cargo-mutants available)
        run: ./scripts/mutation-falsifier.sh --check
      - name: Mutate cosmon-core (advisory — surviving mutants are reported holes)
        continue-on-error: true
        run: ./scripts/mutation-falsifier.sh --whole-tree --package cosmon-core --timeout 180

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo clippy --workspace --locked -- -D warnings

  # TEMPORARY, like its sibling above, and for the same investigation.
  #
  # nextest turned out to be too slow to be the instrument here: on the runner it
  # reached 503 of 7129 tests in 28 minutes, which extrapolates past six hours.
  # One process per test is the wrong shape for a suite whose tests spawn `cs`,
  # tmux and git — the process cost dominates. So this shards the AUTHORITATIVE
  # runner instead, keeping cargo/libtest's own execution model intact and only
  # reducing the surface each job covers.
  #
  # Keeping the model is the point. The hang appears under `cargo test`, and a
  # diagnostic that changes the execution model can only find a different bug.
  # Each shard therefore runs plain `cargo test` with libtest's own threading,
  # bounded, and says which crates it covered.
  #
  # Reading it, in one cycle instead of several:
  #   - one shard bounds out            -> the zone is those crates
  #   - the doctest job bounds out      -> the category is doctests, invisible to nextest
  #   - every shard passes              -> interaction or leakage BETWEEN crates
  #   - several shards bound out        -> shared pollution, not one bad test
  #
  # Gates nothing, deleted once the culprit is named.
  test-shard:
    name: Test (shard ${{ matrix.name }} — diagnostic, gates nothing)
    runs-on: ubuntu-latest
    # 80 = 30 (compile) + 25 (run) + setup, prebuild and upload. The step bounds
    # must stay strictly inside this one: a job cut on its OWN bound skips
    # `if: always()`, which is exactly how the three previous diagnostic runs
    # lost their artifacts. 60 left no room for the tail.
    timeout-minutes: 80
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            needs_cs: true
            args: "-p cosmon-api"
            # 550s local, 84 tests
          - name: remote
            needs_cs: false
            args: "-p cosmon-remote"
            # 539s local, 231 tests
          - name: core
            needs_cs: false
            args: "-p cosmon-core -p cosmon-fuzz -p cosmon-hash -p cosmon-style"
            # 471s local
          - name: runtime
            needs_cs: true
            args: "-p cosmon-runtime -p cosmon-pilot -p cosmon-daemon -p cosmon-mcp -p cosmon-graph -p cosmon-archive -p cosmon-observability -p cosmon-process-witness -p cosmon-cockpit-http -p claudion -p cosmon -p xtask"
            # 466s local
          - name: provider
            needs_cs: false
            args: "-p cosmon-provider -p cosmon-state -p cosmon-agent-harness -p cosmon-ask -p cosmon-notary -p cosmon-ops-tools -p cosmon-registry -p cosmon-surface-canon"
            # 471s local
          - name: transport
            needs_cs: true
            args: "-p cosmon-transport -p cosmon-daemon-supervisor -p cosmon-thin-cli -p apps-transport-http -p cosmon-bridge-claude -p cosmon-scenario -p cosmon-scheduler -p cosmon-verify -p neurion-core"
            # 468s local
          - name: filestore
            needs_cs: false
            args: "-p cosmon-filestore -p cosmon-rpp-adapter -p cosmon-surface -p cosmon-client -p cosmon-cockpit -p cosmon-crashtest -p cosmon-oidc-testkit -p cosmon-thin-macro -p topon-core"
            # 477s local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      # One cache for the whole matrix: without a shared key every shard gets its
      # own and compiles the workspace from cold, which is what made the previous
      # diagnostic job's timing unreadable.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: test-shard
      # Only where a test actually shells out to the binary. `cosmon-api`,
      # `cosmon-runtime` and `cosmon-thin-cli` look for `target/debug/cs` on
      # disk and build it themselves if it is missing — which under any parallel
      # runner means several concurrent `cargo build` queued on the Cargo lock.
      # `cosmon-cli` needs no prebuild: it OWNS the binary, so cargo hands it
      # `CARGO_BIN_EXE_cs` for free. Building it in all eight shards would
      # recompile most of the graph on every runner for nothing.
      - name: Build cs binary (only for shards whose tests shell out to it)
        if: matrix.needs_cs
        run: cargo build --bin cs -p cosmon-cli --locked

      # Compile separately and bounded, so a slow build cannot present itself as
      # a hanging test — the mistake the first diagnostic job made.
      - name: Compile this shard's tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          # The runner declares its own disk, before and after. Three diagnostic
          # runs have now died mid-step with no log, no artifact and no step
          # conclusion — the shape of a runner lost, not of a bound firing. A
          # full `target/debug` for this workspace is tens of gigabytes locally
          # against ~14 GB free here, so exhaustion is a candidate; these two
          # lines are what turn that from a guess into a reading.
          { echo "--- df before ---"; df -h /; } | tee shard-build.log
          cargo test --locked ${{ matrix.args }} --no-run 2>&1 \
            | tee -a shard-build.log
          { echo "--- df after ---"; df -h /; du -sh target 2>/dev/null; } \
            | tee -a shard-build.log

      - name: Run this shard
        timeout-minutes: 25
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "shard=${{ matrix.name }}"
            echo "args=${{ matrix.args }}"
            echo "nproc=$(nproc)"
            echo "online=$(getconf _NPROCESSORS_ONLN)"
            echo "--- df ---"; df -h /
            echo "--- mem ---"; free -m || true
          } | tee shard.log

          # `set +e` + PIPESTATUS: with pipefail and the shell's implicit -e a
          # bounded-out cargo aborts the script before `rc` is written, and the
          # code is the reading. `--kill-after` covers a cargo ignoring SIGINT.
          set +e
          timeout --signal=INT --kill-after=30s 20m \
            cargo test --locked ${{ matrix.args }} \
              -- --nocapture 2>&1 | tee -a shard.log
          rc=${PIPESTATUS[0]}
          set -e

          echo "shard_rc=$rc" | tee -a shard.log
          exit "$rc"

      - name: Upload this shard's output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: shard-${{ matrix.name }}
          path: |
            shard-build.log
            shard.log
          if-no-files-found: warn

  # The zone, after one sharded cycle: every other crate in this workspace runs
  # green in one to three minutes, and `cosmon-cli` alone does not finish. So
  # this job stops grouping and starts naming.
  #
  # 65 test binaries, compiled once, then run ONE AT A TIME under their own
  # bound, each announced before it starts. A binary that outlives the bound is
  # reported by name and the loop carries on to find any others — the log is
  # written progressively, so the name survives even a runner that dies.
  #
  # `cargo test --test <name>` keeps libtest's own threading inside each binary,
  # which is the model the failure appears under. Splitting further — one test
  # per process — would change the model and could only find a different bug.
  #
  # Deleted with the rest of this diagnostic once the culprit is fixed.
  test-cli-targets:
    name: Test (cosmon-cli, one binary at a time — diagnostic, gates nothing)
    runs-on: ubuntu-latest
    # 90 = 30 (compile) + 40 (run) + setup, cache and upload. 75 left five
    # minutes for the tail, which is the same shape that lost the first three
    # diagnostic artifacts: the job's own bound must never be what cuts, because
    # a job cancelled on it skips `if: always()`.
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: test-shard
      - name: Compile cosmon-cli's tests once
        timeout-minutes: 30
        run: |
          set -o pipefail
          { echo "nproc=$(nproc)"; df -h /; free -m || true; } | tee cli-targets.log
          cargo test -p cosmon-cli --locked --no-run 2>&1 | tee -a cli-targets.log

      - name: Run each test binary under its own bound
        timeout-minutes: 40
        continue-on-error: true
        run: |
          set -o pipefail
          # 300s: the slowest of these takes ~170s locally, so a binary still
          # alive at five minutes is not slow, it is stuck.
          BOUND=300
          stuck=(); failed=(); passed=0

          run_target() {   # run_target <label> <cargo args...>
            local label="$1"; shift
            # Announced and flushed BEFORE launching: if the runner dies, this
            # line is the last thing written and it names the culprit.
            echo "=== RUN $label" | tee -a cli-targets.log
            local start=$SECONDS rc=0
            set +e
            timeout --signal=INT --kill-after=15s "$BOUND" \
              cargo test -p cosmon-cli --locked "$@" -- --nocapture \
              >>cli-targets.log 2>&1
            rc=$?
            set -e
            local took=$((SECONDS - start))
            if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
              echo "=== STUCK $label after ${took}s" | tee -a cli-targets.log
              stuck+=("$label")
            elif [ $rc -ne 0 ]; then
              echo "=== FAIL $label rc=$rc in ${took}s" | tee -a cli-targets.log
              failed+=("$label")
            else
              echo "=== ok $label in ${took}s" | tee -a cli-targets.log
              passed=$((passed + 1))
            fi
          }

          # The library first, and alone. `--lib --bins` together is two
          # binaries in one invocation, which is not "one at a time" and would
          # blur the answer across them. The library is also the likeliest
          # target: the last unfinished run was streaming `visual::tests` and
          # `resurrect::tests`, both of which live in it.
          run_target "<lib>" --lib
          run_target "<bin cs>" --bin cs
          for f in crates/cosmon-cli/tests/*.rs; do
            run_target "$(basename "$f" .rs)" --test "$(basename "$f" .rs)"
          done

          {
            echo "=== SUMMARY"
            echo "passed=$passed"
            echo "failed=${failed[*]-}"
            echo "stuck=${stuck[*]-}"
          } | tee -a cli-targets.log

          [ ${#stuck[@]} -eq 0 ] || exit 2
          [ ${#failed[@]} -eq 0 ] || exit 1

      - name: Upload the per-binary output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cli-targets
          path: cli-targets.log
          if-no-files-found: warn

  # The half nextest cannot see at all: it does not run doctests. 116 of them
  # here, in one opaque `rustdoc` phase, so a doctest that hangs is invisible to
  # every per-test instrument and would have been misread as an interaction
  # between ordinary tests.
  test-doc:
    name: Test (doctests — diagnostic, gates nothing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: test-shard
      - name: Run the doctests
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set -o pipefail
          { echo "nproc=$(nproc)"; df -h /; free -m || true; } | tee doc.log
          set +e
          timeout --signal=INT --kill-after=30s 25m \
            cargo test --workspace --locked --doc 2>&1 | tee -a doc.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "doc_rc=$rc" | tee -a doc.log
          exit "$rc"
      - name: Upload the doctest output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: doctests
          path: doc.log
          if-no-files-found: warn

  test:
    name: Test
    runs-on: ubuntu-latest
    # The only job here that carried no bound, while three of its neighbours do.
    # On 2026-07-30 it died twice at ~50 minutes on `cargo test --workspace`,
    # both times with the step's conclusion empty and NO LOG ARCHIVE UPLOADED —
    # the runner was lost rather than a test asserting false, so the failure was
    # undiagnosable from outside. An explicit bound makes Actions cut the job
    # itself, which uploads what ran. This does not fix that failure; it makes
    # the next occurrence readable, which nothing local could.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install system libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # T-CST-PARITY: the cs ↔ cs-thin parity test in
      # `crates/cosmon-thin-cli/tests/parity_with_cs.rs` exec's the cs
      # binary as a subprocess. `cargo test --workspace` does not build
      # binaries by default, so we explicitly build cs first; the test's
      # `find_cs_binary()` then resolves it from `target/debug/cs`.
      # See docs/guides/cs-thin-parity.md §CI for the rationale.
      - name: Build cs binary (parity gate prerequisite)
        run: cargo build --bin cs -p cosmon-cli --locked
      - run: cargo test --workspace --locked

