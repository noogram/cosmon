# cargo-audit configuration — supply-chain hygiene gate.
#
# Advisories listed here are *temporary* exceptions tracked separately
# (see deny.toml [advisories.ignore] for the same set + rationale).
# When the upstream fix lands, remove the entry from BOTH this file
# and deny.toml. Drift between the two means one tool will start to
# complain — that is the desired alarm.
#
# Reference: delib-20260425-39c1 §V (supply-chain sprint),
# forgemaster.md §1 (cargo-audit pinning).

[advisories]
ignore = [
    # bincode 1.x via tui-markdown→syntect — awaiting syntect bump.
    "RUSTSEC-2025-0141",
    # yaml-rust via tui-markdown→syntect — upstream migrating to yaml-rust2.
    "RUSTSEC-2024-0320",
    # paste proc-macro via ratatui→paste (the ex-candle path was removed with
    # the voice bridge, ADR-126) — awaiting ratatui dropping the proc-macro.
    "RUSTSEC-2024-0436",
    # rand 0.9 unsoundness via proptest→rand in cosmon-fuzz — not reachable
    # from cosmon code (we never install a custom logger).
    "RUSTSEC-2026-0097",
    # lru 0.12 unsoundness via ratatui 0.29 — Stacked-Borrows IterMut bug,
    # not reachable from cosmon TUI code (we never iter_mut this LRU).
    "RUSTSEC-2026-0002",
    # lru pop() panic-safety (INFO/Unsound) via ratatui→lru 0.12 and
    # ratatui-core→lru 0.16. Structurally unreachable: the only cache key in
    # either crate is (Rect, Layout) — numeric-only, zero `impl Drop` in both
    # crates — so no user Drop can panic inside pop(). The fix needs
    # lru >= 0.18.2, reachable only via a ratatui 0.30 bump that adds 56 crates
    # and leaves cargo vet with 65 unvetted dependencies. Full rationale and
    # the two lapse conditions live in deny.toml [advisories.ignore].
    "RUSTSEC-2026-0253",
]
