     AFFIRMATIVE clean in BOTH files, AND require the pair to be \
     consistent under the stated polarity — a missing \
     `mechanism_polarity` is NOT-CLEAN, never a polarity the reader \
     picks. A check shaped `verdict != "FINDINGS"` reads REFUTED as \
     clean — clean is something a seat says, never something a reader \
     fails to find. AND WRITE THE FIELD, do not rely on this formula \
     having said what the polarity always is: every seat's verdict.json \
     carries `"mechanism_polarity": "fix"` literally, because the \
     reader that enforces the rule \
