[package]
name = "cosmon-oidc-testkit"
publish.workspace = true
# Ships the user-facing `cs-oidc-mock` binary in the public service tarball
# (task-20260717-c487) → inherits the release version. See the
# `[workspace.package]` rule in the root Cargo.toml.
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Test infrastructure for §8j HTTPS+OIDC adapters: in-memory JWKS endpoint, JWT issuance, tenant-cwd workspace fixtures (ADR-080)."

# The `fake-cs` stand-in binary and its `build.rs` were retired with the
# ADR-080 §3.5 clause (e) subprocess envelope (issue #54 U6): the
# adapter no longer spawns `cs`, so the tests exercise the library seam
# (`cosmon_transport::MockBackend` / the worker envelope) instead.

# `cs-oidc-mock` — V0 demo IdP shipped as a runnable binary. Promoted
# from the dev-only [`OidcMock`] axum harness so the §8j HTTPS+OIDC
# adapter can be exercised live (tenant_auditor cURL flow), without staging a
# Keycloak instance. NOT a production IdP — the signing key is the
# same RSA test key embedded in this crate's test PEMs.
[[bin]]
name = "cs-oidc-mock"
path = "src/bin/cs-oidc-mock.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
# S256 code-challenge verification and the base64url-nopad encoding of the
# challenge and of the opaque authorization codes (`idp` module, issue #53).
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
jsonwebtoken = "9"
# OS CSPRNG behind the opaque authorization codes. A guessable code is a
# login anyone on the network can complete on someone else's behalf — a
# property this mock has no reason to lack.
rand = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
