# --- G3 falsification of the test (anti-tautology) ------------------------
[[spore.node]]
id          = "falsify"
kind        = "fixed"
formula     = "task-work"
description = "G3 falsification (BLOCK): mutate the EXPECTED fix -> the red test must go red (anti-tautology). A test that stays green under a mutated fix is not an oracle. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G3 TEST FALSIFICATION (anti-tautology, fail-closed).
The reproduce gate froze a red test on ${params.affected_ref}. Prove the test has
TEETH: apply the DIFFERENTIAL REFUTATION from ${run_dir}/reproduce/ — flip exactly ONE
variable (the expected fix) and confirm the colour BASCULES (red<->green). A test
whose colour does not move when the fix is mutated is a tautology, not an oracle
(diagnosis-discipline CLAUSE 4). Independently, confirm the fixture does NOT derive
its oracle from the thing under test (no reuse of the same constant / resolver the
code under test uses to compute the expected value). Emit ${output_dir}/falsify.md
AND ${output_dir}/verdict.json in the §8 ADMISSION SHAPE below. FAIL-CLOSED: if the
mutation does not redden the test, BLOCKED with the tautology named.

§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED, count, population,
findings[], base_sha, subject_digest, negative_control{gate_key, mutation, target,
observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY IS INADMISSIBLE
(the consumer reads it as BLOCKED). You already run the colour-moves discipline on
ONE artifact; these keys are the same discipline turned on YOU. `population` = the
number of mutations you applied; count 0 over population 0 is a vacuous green.
`subject_digest` = the frozen red's content hash from ${run_dir}/reproduce/,
recomputed by the consumer. `base_sha` = the commit THIS verdict was computed on.
NEGATIVE CONTROL: hand this gate a test whose colour does NOT move under the
mutation and re-run — the recorded verdict MUST flip to BLOCKED; observed_verdict
== verdict means the gate is colour-blind and its PASS is VOID. `gate_key` =
sha256(this topic + the script you invoked): if ${run_dir}/admissions/<gate_key>.json
exists, COPY the record forward and run no mutation; otherwise run it once and
write it there. The record is copied INTO this verdict.json — NO SIDE LEDGER — and
the consumer recomputes `gate_key`.
"""

# --- G4 implement (smallest fix) ------------------------------------------
[[spore.node]]
id          = "implement"
kind        = "fixed"
formula     = "task-work"
description = "G4 implementation (BLOCK): the smallest patch that satisfies the G1 contract; keeps the domain I/O-free; no authority to relax any gate. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G4 IMPLEMENTATION (fail-closed). Write the SMALLEST
patch that makes the G2 red pass while satisfying the G1 contract verbatim. Do NOT
optimise to preserve a defective behaviour (e.g. for a root-bypass bug, the fix
must reach one of the CONTRACT-approved outcomes, never keep the unsafe shortcut).
Keep the domain core I/O-free (ports stay injectable). Return Result; no unwrap /
expect. Document every public item. Update the CLI/UI parity audit if a
user-facing command changed. This node has NO authority to relax any gate. Emit
${output_dir}/implement.md (the patch summary + the files touched) AND
${output_dir}/verdict.json in the §8 ADMISSION SHAPE below. FAIL-CLOSED.

§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED, count, population,
findings[], base_sha, subject_digest, negative_control{gate_key, mutation, target,
observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY IS INADMISSIBLE
(the consumer reads it as BLOCKED). `population` = the number of contract clauses
from G1 your patch had to satisfy; count 0 over population 0 is a vacuous green.
`subject_digest` = a content hash of the files you touched, recomputed by the
consumer. `base_sha` = the commit THIS verdict was computed on — and it is NOT the
same fact as the reproduction's `parent_commit`, which is what the red was RED on.
NEGATIVE CONTROL: reach green by EDITING THE FROZEN TEST instead of the code and
re-run — the recorded verdict MUST flip to BLOCKED; observed_verdict == verdict
means the gate is colour-blind and its PASS is VOID. `gate_key` = sha256(this
topic + the script you invoked): if ${run_dir}/admissions/<gate_key>.json exists,
COPY the record forward and run no mutation; otherwise run it once and write it
there. The record is copied INTO this verdict.json — NO SIDE LEDGER — and the
consumer recomputes `gate_key`.
"""

# --- G5 green on the original red -----------------------------------------
[[spore.node]]
id          = "green"
kind        = "fixed"
formula     = "task-work"
description = "G5 green on the frozen red (BLOCK): the SAME frozen test/fixture/command/timeout now passes UNCHANGED. No substituted test. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G5 GREEN ON THE ORIGINAL RED (fail-closed). Run the
EXACT frozen red from ${run_dir}/reproduce/ (same image, same fixture, same command, same
timeout) against the fixed tree and confirm it now passes UNCHANGED. Compare the
frozen hash: the test bytes MUST be identical to the ones hashed at G2 (never a
substituted or edited test blessed to green — see 'never bless a golden to get
green'). Emit ${output_dir}/green.md AND ${output_dir}/verdict.json in the §8
ADMISSION SHAPE below.
FAIL-CLOSED: a green obtained by editing the test, or a hash mismatch vs the frozen
red, is BLOCKED.

§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED, count, population,
findings[], base_sha, subject_digest, negative_control{gate_key, mutation, target,
observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY IS INADMISSIBLE
(the consumer reads it as BLOCKED). `population` = the number of assertions the
frozen red actually executed — NOT the number it declares; a suite that ran zero
assertions and reported zero failures is the `#[ignore]`d suite again, and
`population` is the field that makes it visible. `subject_digest` = the frozen
red's content hash, recomputed by the consumer against ${run_dir}/reproduce/.
`base_sha` = the commit THIS verdict was computed on. NEGATIVE CONTROL: run the
same frozen red against the UNFIXED tree and re-run — the recorded verdict MUST
flip to BLOCKED; observed_verdict == verdict means the gate is colour-blind and
its PASS is VOID. `gate_key` = sha256(this topic + the script you invoked): if
${run_dir}/admissions/<gate_key>.json exists, COPY the record forward and run no
mutation; otherwise run it once and write it there. The record is copied INTO this
verdict.json — NO SIDE LEDGER — and the consumer recomputes `gate_key`.
"""

# --- G8 CI gate (cheap before dear) ---------------------------------------
[[spore.node]]
id          = "ci-gate"
kind        = "fixed"
formula     = "task-work"
description = "G8 CI (BLOCK, NOT-RUN blocks, BLOCKED-INCOMPLETE is its own outcome): check + test --no-fail-fast + clippy -Dwarnings + fmt + doc, BEFORE the dear judgement loop. Waits on a NAMED run id, never on an empty query. Result files are keyed per gate and per attempt; a duplicate key BLOCKS. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G8 CI GATE (fail-closed, cheap-before-dear). Run the
repo's configured gates and record each exit status to a FILE (never read an exit
code through a pipe):
  cargo check --workspace
  cargo test --workspace --no-fail-fast   (wrap in `timeout 600`; a timeout is a FINDING)
  cargo clippy --workspace -- -D warnings
  cargo fmt --all -- --check
  RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
The doc gate is the one no other subsumes: a broken intra-doc link compiles, lints,
and tests green and fails only in CI on main.

`--no-fail-fast` IS LOAD-BEARING, NOT A PREFERENCE. Without it cargo stops at the
FIRST failing target, so one stale suite hides every red behind it and you report
"one failure" for a run that never reached the other crates. Fail-fast is an
INFORMATION-DESTROYING operation at IDENTICAL wall-clock — the run costs what it
costs; only the report shrinks. One run then yields the FAILURE VECTOR instead of
the first failure. Free exergy, one flag.

COUNT THE SUITES, AND SAY SO. Record `suites_run` and `suites_total` and compare
them. If `suites_run < suites_total` the outcome is BLOCKED-INCOMPLETE — A
DISTINCT OUTCOME THAT MUST NEVER BE REPORTED AS "the CI gate found a bug". A run
that stopped early found out less than it was asked to; calling that a finding
converts a measurement failure into a quality verdict, which is the exact
substitution the convergence's VOID rule refuses elsewhere.

BIND THE RESULT FILENAME, PER GATE AND PER ATTEMPT. Each gate's captured status
goes to ${output_dir}/gates/<gate>/<attempt>.json — never one shared file, never
last-writer-wins. If a gate key would be written twice, BLOCK with
`duplicate-gate-record` and name both writers. Last-writer-wins on a verdict path
is how one gate's green comes to stand for another's.

WAIT ON A NAMED ENTITY, NEVER ON THE EMPTINESS OF A QUERY. If this gate waits on a
remote CI run: RESOLVE THE RUN ID whose `head_sha` EQUALS the commit under test;
if no such run exists after a bounded interval, BLOCK with `ci-run-not-found`; only
then wait on THAT ID. Polling "are there any pending runs?" and reading zero over
an EMPTY LIST is a universal over an empty domain — it forbids nothing, and it is
the same logical error as the `#[ignore]`d suite and the provenance gate that
printed `skip` and exited 0.

Emit ${output_dir}/ci-gate.md (one line per gate with its captured exit code) AND
${output_dir}/verdict.json in the §8 ADMISSION SHAPE below. FAIL-CLOSED and NOT-RUN
blocks: a gate that did not run is BLOCKED, not skipped. This runs BEFORE the
convergence (cheap before dear).

§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED|BLOCKED-INCOMPLETE,
count, population, suites_run, suites_total, findings[], base_sha, subject_digest,
negative_control{gate_key, mutation, target, observed_verdict, evidence_digest}},
and A PASS MISSING ANY KEY IS INADMISSIBLE (the consumer reads it as BLOCKED).
`population` = the number of gates you actually executed; count 0 over population
0 is a vacuous green. `subject_digest` = the tree sha you built, recomputed by the
consumer. `base_sha` = the commit THIS verdict was computed on. NEGATIVE CONTROL:
plant one `clippy::needless_return` in a workspace crate and re-run — the RECORDED
CLIPPY EXIT CODE must flip and the verdict with it; observed_verdict == verdict
means the gate is colour-blind and its PASS is VOID. That mutation is minutes, and
it is paid once: `gate_key` = sha256(this topic + the script you invoked), so if
${run_dir}/admissions/<gate_key>.json exists you COPY the record forward and run
NOTHING. The record is copied INTO this verdict.json — NO SIDE LEDGER — and the
consumer recomputes `gate_key` rather than trusting the file.
"""

# --- §6bis converge (EMERGENT — the double clean-room review; replaces G6+G7) -
# The ONLY non-Tier-0 node: it nucleates children (a committee per verdict, plus one
# fix between them) FORWARD via `cs nucleate --blocked-by` (auto-parent contract
# COSMON_PARENT_MOL_ID). Whether the second verdict is convened at all is not
# knowable at germination, so it is an EMERGENT zone and MUST declare [bounds]
# (ADR-140 D2). The bound is the seal's Termination variant — and since v2 it is
# STRUCTURAL: there are two named verdict states and no counter to raise.
#
# NOTE for anyone tempted to add a fifth key here: `RawBounds` in
# crates/cosmon-core/src/spore/mod.rs has exactly four fields and no `Raw*` struct
# there carries `deny_unknown_fields`, so a fifth key PARSES, VANISHES, and becomes
# another knob with no power. New constraints go into `stop_condition`, which is
# read, or into the formula, which is executed.
[[spore.node]]
id          = "converge"
kind        = "emergent"
for_each    = "${nodes.converge.verdicts}"
formula     = "converge-clean-room"
description = "§6bis double-engine convergence (BLOCK), as TWO IMMUTABLE VERDICTS over `cross-provider-committee`: an INITIAL verdict and — only if it found something AND the fix moved the tree sha — one CONFIRMATION verdict. CLEAN is the conjunction over the BALLOT-CARRYING seats and is never satisfied by an off-ballot voice; an absent/unparseable/undelivered seat verdict is VOID and does not advance the state; a repeated finding set or verdict shape exits immediately. No round counter, no third verdict. Replaces G6 breaker + G7 judge."
[spore.node.bounds]
output_type    = "review-verdict"
max_instances  = 2    # STRUCTURAL: two named verdict states, not a counter set low
stop_condition = """
A verdict renders CLEAN — the conjunction over a NON-EMPTY set of BALLOT-CARRYING \
seats (`on_ballot`, `diversity_weight > 0`), every seat `delivered` — and the \
convergence stops there. Otherwise it stops BLOCKED with a typed exit_reason and a \
human escalation, never a silent pass: `confirmation-findings` when the CONFIRMATION \
verdict found something new, `no-new-information` / `verdict-shape-repeated` when it \
found the same thing again, `verdict-plumbing` / `jury-not-rendered` when a jury did \
not sit. A VOID verdict (absent, malformed, unparseable, undetermined ballot, or a \
seat not `delivered`) does NOT advance the state and does NOT consume a verdict: the \
seat is re-dispatched once, and a second void collapses on `verdict-plumbing`. A \
CONFIRMATION whose target tree sha EQUALS the INITIAL's is REFUSED, not rendered — \
re-reading an unchanged tree with the same jury cannot produce information. There is \
no third verdict under any outcome.
"""
# WHICH var carries the run-time ceiling. `max_rounds` no longer DRIVES anything —
# the control flow is the two named states — but the binding must stay: without it
# the ceiling above and the formula's backstop are two unrelated numbers, and
# `--var max_rounds=100` would germinate a zone that foams past its own sealed bound
# with nothing saying a word. Declared here, `cs spore validate` / `cs spore run`
# refuse it.
instances_var  = "max_rounds"
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — §6bis DOUBLE CLEAN-ROOM CONVERGENCE (fail-closed),
rendered as TWO IMMUTABLE VERDICTS: an INITIAL verdict, and — only if it found
something AND the fix moved the target tree sha — one CONFIRMATION verdict. There
is no round counter and no third verdict. CLEAN is the conjunction over the
BALLOT-CARRYING seats only; an off-ballot CLEAN certifies nothing. A verdict that
measured nothing is VOID: it does not advance the state, the seat is re-dispatched
once, and a second void collapses on `verdict-plumbing` rather than being patched
against findings nobody collected.

EVERY SEAT DECLARES ITS SURFACE BEFORE IT REVIEWS. The first artefact each seat
writes — before it forms any opinion — is
${output_dir}/seats/<seat>/surface_enumerated.json {arms[], paths[], commands[]}: the
arms it will exercise, the paths it will read, the commands it will run. Written
first, on purpose: a surface declared afterwards is a description of what the seat
happened to do, and describes a review instead of scoping it. This converts "I
reviewed X" from TESTIMONY into a claim WITH A DOMAIN — which is the only form in
which a coverage gap is visible at all. A seat that renders a verdict with no
surface_enumerated.json is VOID on the plumbing rule above, exactly like a seat with
no verdict.json: a review whose domain is unknown measured an unknown amount, and the
E1 miss was a coverage failure, never a sensitivity failure — the seats produced
findings twelve rounds running while nobody ran the arm the defect lived in.
Aggregate the seats' declarations into ${output_dir}/surface_enumerated.json (the
union, with the seat that claimed each entry) for `release` to compare against.

§8 ADMISSION SHAPE — every seat's verdict.json AND this node's folded verdict.json
are {verdict, count, population, findings[], base_sha, subject_digest,
negative_control{gate_key, mutation, target, observed_verdict, evidence_digest}},
and A CLEAN MISSING ANY KEY IS INADMISSIBLE — VOID on the plumbing rule above,
exactly like an absent verdict.json, never a FINDINGS verdict to be patched
against. `population` = the number of surface elements the seat DECLARED and then
actually exercised; a CLEAN with population 0 is a seat that reviewed nothing, and
it is the emptiest of the empty domains — twelve rounds of findings never told us
what was NOT looked at. `subject_digest` = the tree sha the seat reviewed,
recomputed by the consumer; a CONFIRMATION whose subject_digest EQUALS the
INITIAL's is the unchanged-tree refusal already stated above, now mechanically
detectable. `base_sha` = the commit THIS verdict was computed on. NEGATIVE
CONTROL: hand the folding logic a seat verdict.json that is absent or malformed
and confirm the fold renders VOID — not CLEAN, and not FINDINGS. If a broken seat
file can still produce a CLEAN, the conjunction is decorative and its CLEAN is
VOID. `gate_key` = sha256(this topic + the committee formula it nucleates): if
${run_dir}/admissions/<gate_key>.json exists, COPY the record forward and run no
mutation; otherwise run it once and write it there. The record is copied INTO the
verdict.json — NO SIDE LEDGER — and the consumer recomputes `gate_key`.
"""
issue        = "${params.issue}"
max_rounds   = "${params.max_rounds}"
risk         = "${params.risk}"

# --- G9 rehearsal (packaged artefact, not the dev build; UNCONDITIONAL matrix) -
# Fed by `ci-gate`, in PARALLEL with `converge`, and no longer downstream of it: the
# rehearsal needs the CI's green and the packaged bytes, and never needed anybody's
# review opinion. The old ci-gate -> converge -> rehearsal chain was a serialization
# nobody had a causal reason for, and removing it removes zero checks.
#
# The matrix is UNCONDITIONAL — all four cells, whatever `risk` says. This is the
# amendment with a measured proof behind it: the matrix used to widen only at
# release/security while `risk` DEFAULTED to normal, so the default posture switched
# off the exact arm the #20 defect lived in — a refused root dispatch that left
# root-owned residue behind. And E3's `#[ignore]`d root-only suite, which ran on
# nobody's machine, is the same class of hole, second occurrence, in this same file.
# It is also the closest thing to internalising the outsider that exists: the matrix
# IS run-the-arm-you-would-not-have-run.
[[spore.node]]
id          = "rehearsal"
kind        = "fixed"
formula     = "task-work"
description = "G9 rehearsal (BLOCK): install the SIGNED packaged artefact (not the dev build) and re-run the frozen red green across the UNCONDITIONAL matrix root+non-root x amd64+arm64, regardless of risk. Each cell writes its own verdict at a cell-keyed path; a cell that did not run is BLOCKED, never skipped. Fed by ci-gate in parallel with converge. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G9 REHEARSAL (fail-closed, UNCONDITIONAL MATRIX).
Install the PACKAGED, SIGNED artefact (NOT the dev build) and re-run the frozen red
from ${run_dir}/reproduce/ — it must go green FROM THE PACKAGED BYTES.

Run ALL FOUR CELLS, whatever ${params.risk} says: {root, non-root} x {amd64, arm64}.
The matrix is not widened by a posture param any more, because the posture param
defaulted to the value that switched off the arm the last real defect lived in. Each
cell writes its OWN verdict at its OWN cell-keyed path —
${output_dir}/cells/<uid>-<arch>/verdict.json, e.g. cells/root-arm64/verdict.json —
plus that cell's log. Distinct paths per cell are what keeps four parallel writers
from aliasing one file and one cell's green from being read as another's.

A CELL THAT DID NOT RUN IS BLOCKED, NEVER SKIPPED. No arm64 runner, no root
permission, an emulator you do not trust: all of those are BLOCKED cells with the
reason named, and BLOCKED cells make this gate BLOCKED. A missing cell must never
render as a silent pass or as an absent row — an absent row is how a whole arm goes
missing without anybody deciding to drop it. If a cell is genuinely unobtainable in
this environment, it is BLOCKED here and it goes into the release manifest's
`arms_not_run[]` as a DECLARED blind spot; that is the only route by which the
mission proceeds past an unrun arm, and it costs somebody a sentence they have to
write and a human has to read.

Emit ${output_dir}/rehearsal.md (the four-cell matrix, every cell's verdict and
reason) AND ${output_dir}/verdict.json in the §8 ADMISSION SHAPE below, whose
`cells: {"<uid>-<arch>": PASS|BLOCKED}` map carries all four keys ALWAYS.
FAIL-CLOSED: a green from the dev build instead of the packaged artefact is
BLOCKED; a `cells` map with fewer than four keys is BLOCKED.

§8 ADMISSION SHAPE — verdict.json is {verdict: PASS|BLOCKED, count, population,
findings[], cells{}, base_sha, subject_digest, negative_control{gate_key,
mutation, target, observed_verdict, evidence_digest}}, and A PASS MISSING ANY KEY
IS INADMISSIBLE (the consumer reads it as BLOCKED). `population` = 4, always, and
it is the whole point of writing it down: the denominator is FIXED by the matrix,
so a `cells` map with three entries is arithmetically visible rather than
rhetorically absent. `subject_digest` = the content digest of the PACKAGED
ARTEFACT you installed — not the commit id, which is the property NEXT DOOR to
tree identity; the consumer recomputes it from the artefact, which is what makes
"I installed the packaged bytes" checkable instead of testified. `base_sha` = the
commit THIS verdict was computed on. NEGATIVE CONTROL: install the DEV BUILD
instead of the packaged artefact and re-run — this gate MUST BLOCK; if it still
renders PASS it never distinguished the two, and its PASS is VOID. `gate_key` =
sha256(this topic + the install script you invoked): if
${run_dir}/admissions/<gate_key>.json exists, COPY the record forward and run no
mutation; otherwise run it once — it is minutes — and write it there. The record
is copied INTO this verdict.json — NO SIDE LEDGER — and the consumer recomputes
`gate_key`.
"""

# --- §9 dissent: NO LONGER A NODE ----------------------------------------
# It is a FIELD of the release manifest (operator decision D1 on
# delib-20260729-1d4e — `rehearsal`, `dissent` and `confirm` come off the blocking
# path). It was never a measurement: it dispatched a worker to write a paragraph that
# the release gate then had to read back out of a verdict.json, so the node bought a
# molecule, a worktree and a handoff for a field that the node validating it could
# hold directly. Nothing is relaxed by the fold — the empty-brief hard-block moved
# INTO `release` below and grew a second mandatory field (`arms_not_run[]`) and a
# stricter one (`overruled_by` must name a HUMAN). The shape is
# {brief, residuals[], arms_not_run[], overruled_by, rationale}.

# --- G10 release (signed manifest; NO agent pushes) -----------------------
[[spore.node]]
id          = "release"
kind        = "fixed"
formula     = "task-work"
description = "G10 release (BLOCK, and the §8 ADMISSION ENFORCEMENT POINT — the one check whose absence is the absence of the release): assemble the signed manifest (commit, red-hash, image digest, versions, CI ids, all verdicts, the four-cell matrix, the route deviations, the declared-surface comparison, and the folded dissent field with its non-empty arms_not_run[]). Refuses any upstream verdict lacking population / subject_digest / base_sha / negative_control; BLOCKS on a vacuous green (count 0 over population 0), on a colour-blind gate (observed_verdict == verdict), on a recomputed digest or gate_key that disagrees, and on any upstream base_sha that is NOT an ancestor of the release commit. Fed by converge, rehearsal AND route. PASS here is the polymer's terminal success state, CANDIDATE-LANDED. NO agent pushes to any remote — the human gate is the only door. Emits verdict.json."
[spore.node.vars]
topic = """
COSMON-DEV ${params.issue} — G10 RELEASE MANIFEST (fail-closed, NO PUSH). Assemble
${output_dir}/release-manifest.json validating the WHOLE dossier (never inferring
success from completion), reading each upstream gate's verdict from
${run_dir}/<gate>/verdict.json: the fix commit sha, the FROZEN red hash from G2, the
clean-room image digest, the affected_ref (${params.affected_ref}) and
upstream_version (${params.upstream_version}), the CI verdict, the convergence's
ballot-weighted CLEAN verdict (verdict CLEAN with a NON-EMPTY ballot_seats set — an
empty ballot is never a pass), the rehearsal `cells` map with ALL FOUR keys PASS, and
the author-independent `route` verdict from ${run_dir}/route/ with its deviation list.

§8 ADMISSION, VALIDATED HERE — AND THIS IS WHY IT IS HERE. Every gate above shares
one property with the seven that let a defect through: the thing it guarded
proceeded whether or not it ran. THIS manifest has the inverse property — its
absence is the absence of the release — so it is the one enforcement point that
cannot be silently switched off. The immunity argument is written down so it can
be AUDITED: FALSIFIER — exhibit a path by which a release ships WITHOUT this
manifest and the argument is refuted and withdrawn.

For EVERY upstream verdict.json you read, REFUSE it as evidence unless it carries
all of: `population`, `subject_digest`, `base_sha`, and
`negative_control{gate_key, mutation, target, observed_verdict, evidence_digest}`.
Then, mechanically:
  * A PASS with `count == 0` AND `population == 0` is a VACUOUS GREEN => BLOCKED.
    A universal over an empty domain forbids nothing.
  * RECOMPUTE `subject_digest` yourself from the artefact the gate names. A digest
    you only read back is the producer's testimony with a hexadecimal accent.
  * RECOMPUTE `gate_key` = sha256(that gate's topic + the script it invoked) and
    check it EQUALS the `gate_key` inside its `negative_control`. A record you do
    not re-key is an `admission.json` by another name — the provenance gate that
    printed `skip` and exited 0, rebuilt.
  * `negative_control.observed_verdict == verdict` => THE GATE IS COLOUR-BLIND and
    its PASS is VOID => BLOCKED, naming the gate. A well-formed verdict artifact
    saying PASS is exactly what a gate measuring the property NEXT DOOR emits; §8
    constrains the SHAPE of the evidence, never its RELEVANCE, and the negative
    control is the only field in the shape that speaks to relevance.
  * `base_sha` ANCESTRY (BLOCKS): for every upstream verdict, `git merge-base
    --is-ancestor <base_sha> <release commit>` must succeed. IF ANY UPSTREAM
    VERDICT'S `base_sha` IS NOT AN ANCESTOR OF THE RELEASE COMMIT => BLOCKED,
    naming the gate and both shas. A verdict computed on a tree nobody is shipping
    is not evidence about the tree everybody is. Note `base_sha` is NOT
    `parent_commit`: the reproduction's `parent_commit` is what the red was RED
    on, `base_sha` is what the verdict was COMPUTED on, and the two were one field
    until now.
  * `ci-gate` reporting BLOCKED-INCOMPLETE is a MEASUREMENT failure, never a
    quality finding: BLOCKED with `ci-incomplete`, and it must not be written up
    as "the CI gate found a bug".

THE DECLARED-SURFACE COMPARISON (BLOCKS). Enumerate the issue's FULL SEMANTIC SURFACE
by the bug-closure rite — every code path, help text, man page, test and snapshot the
issue's verb touches — and write it to ${output_dir}/surfaces.md. Then read every
surface_enumerated.json the reviewing seats and the `route` walker wrote, and compare:
for each element of the semantic surface, WHICH seat declared it. Write
${output_dir}/coverage.md as that table. A surface element NO seat declared is a
COVERAGE GAP, and a gap you cannot EXPLAIN is BLOCKED. An explanation is a sentence
naming why the element needs no seat (it is generated from a declared one, it is
unreachable on this platform, …), never "it looked fine". You do the enumeration here
rather than waiting for G11 because G11's external replay is asynchronous now and the
comparison must stay on the blocking path — the enumeration half of the closure rite
is mechanical and available before the candidate lands.

THE DISSENT FIELD, folded in (no longer a node) — shape
{brief, residuals[], arms_not_run[], overruled_by, rationale}:
  * `brief` — the single strongest reason this fix should NOT ship (correctness,
    blast-radius, a residual the convergence recorded as off-ballot). EMPTY IS A
    HARD-BLOCK: a release with no recorded dissent is groupthink.
  * `residuals[]` — the findings the convergence recorded from OFF-BALLOT seats and
    correctly did not block on. They block nothing and they are not allowed to vanish.
  * `arms_not_run[]` — MANDATORY AND NON-EMPTY. Every arm, cell, platform, path or
    scenario this mission DID NOT exercise: the rehearsal cells that came back BLOCKED
    as unobtainable, the surfaces no seat declared and you explained away above, the
    substrates nobody had. This is NOT a verdict; it is a DECLARED BLIND SPOT. A
    manifest asserting there is no unrun arm is REFUSED — BLOCKED, with this sentence
    quoted back: the last winning defect lived in the negative space of a document
    nobody wrote, and this field is that document.
  * `overruled_by` — REQUIRED, and it must name a HUMAN IDENTITY. Not "the panel", not
    a molecule id, not an adapter, not you. An agent may not overrule the dissent it
    or its siblings authored; a machine overruling a machine's objection is the loop
    marking its own homework.
  * `rationale` — the named reason for the overrule.

Run `scripts/publish.sh --check` for the scrub projection. Emit
${output_dir}/verdict.json in the SAME §8 admission shape you enforce on everyone
else — {verdict, count, population, findings[], base_sha, subject_digest,
negative_control{gate_key, mutation, target, observed_verdict, evidence_digest}} —
because a validator exempt from its own rule is the eighth instance. `population`
= the number of manifest fields you validated. YOUR NEGATIVE CONTROL: strip
`arms_not_run[]` from the manifest and re-run — this gate MUST BLOCK. FAIL-CLOSED:
any missing manifest field => BLOCKED; a `risk` value of normal over a diff that
touches the security surface (see the `risk` param's mechanical rule) => BLOCKED with
the matching paths named. A PASS here is the polymer's TERMINAL SUCCESS STATE and it
is called CANDIDATE-LANDED, not CLOSED — closure belongs to G11 and arrives later. NO
AGENT PUSHES: the output stays on the feat-branch; the actual push/tag is a HUMAN
gate. State this explicitly in ${output_dir}/release.md.
"""

# --- G11 confirm (external replay; ASYNCHRONOUS, OFF THE BLOCKING PATH) ---
# The polymer's terminal success state is CANDIDATE-LANDED at `release`; this node
# flips it to CLOSED afterwards (operator decision D1 — `confirm` comes off the
# blocking path). The `release -> confirm` edge SURVIVES, because you cannot replay a
# candidate that does not exist yet; what changed is that nothing waits on the
# verdict. No check is removed, only a false serialization: the thing G11 was
# genuinely blocking on — the semantic-surface enumeration — moved UP into `release`,
# where it now blocks on a declared-coverage gap. What stays here is the half that
# depends on a HUMAN BEING ELSEWHERE replying, and a gate whose latency is another
# person's inbox was never a gate; it was a queue with a gate's name on it.
[[spore.node]]
id          = "confirm"
kind        = "fixed"
formula     = "bug-closure"
description = "G11 external confirm (ASYNCHRONOUS, off the blocking path): the reporter replays the landed candidate; bug-closure emits the CLOSED/REOPEN verdict over the full semantic surface, flipping CANDIDATE-LANDED to CLOSED. Blocks nothing — release already blocked on the enumeration half. Emits verdict.md."
[spore.node.vars]
bug_molecule_id = "${params.issue}"
topic = """
COSMON-DEV ${params.issue} — G11 EXTERNAL CONFIRM + CLOSURE (fail-closed). Run the
bug-closure ritual: enumerate the full semantic surface the issue's verb touches
(code, help text, man page, tests, snapshots), confirm the fix leaves NONE stale,
and record the reporter's replay of the release candidate on their environment.
Emit ${output_dir}/surfaces.md, ${output_dir}/coverage.md, ${output_dir}/verdict.md. The verdict is CLOSED only if every
surface is repaired AND the external replay went green on the reporter's
environment; else REOPEN with the named gap. Absent external replay for an
env-specific issue => REOPEN, never CLOSED.

YOU RUN AFTER THE CANDIDATE HAS LANDED, and you block nothing: the release gate
already reached CANDIDATE-LANDED on its own enumeration and its own declared-coverage
comparison. Your job is to flip that state to CLOSED, or to REOPEN it. So COMPARE
rather than repeat: read the semantic surface `release` enumerated in
${run_dir}/release/surfaces.md and say explicitly whether your independent enumeration
agrees with it. A surface `release` missed is a finding about the RELEASE GATE, not a
footnote — name it as one, because it means the blocking comparison was run against a
short list.
"""

# ==========================================================================
# Typed edges (feeds / produces / verifies) -> blocked-by links at expansion.
# Diamond topology (blueprint §3): reproduce forks into the fix arm and the
# falsification arm; they reconverge at green.
# ==========================================================================
[[spore.edge]]
from = "intake"
to   = "contract"
type = "feeds"

[[spore.edge]]
from = "contract"
to   = "reproduce"
type = "feeds"

# reproduce forks: the fix arm (implement) and the falsification arm (falsify).
[[spore.edge]]
from = "reproduce"
to   = "implement"
type = "feeds"

[[spore.edge]]
from = "reproduce"
to   = "falsify"
type = "verifies"

# diamond reconverges at green: the fix must pass the frozen red AND the test must
# have survived the anti-tautology falsification.
[[spore.edge]]
from = "implement"
to   = "green"
type = "feeds"

[[spore.edge]]
from = "falsify"
to   = "green"
type = "verifies"

[[spore.edge]]
from = "green"
to   = "ci-gate"
type = "verifies"

# CI (cheap) before the convergence (dear). ci-gate then forks: the review arm and
# the rehearsal arm run IN PARALLEL and reconverge at release. They were serialized
# (ci-gate -> converge -> rehearsal -> release) for no causal reason — the rehearsal
# consumes the CI's green and the packaged bytes, never the review's verdict — so
# un-serializing them turns one long leg into two short ones and removes zero checks.
[[spore.edge]]
from = "ci-gate"
to   = "converge"
type = "feeds"

[[spore.edge]]
from = "ci-gate"
to   = "rehearsal"
type = "feeds"

# Both arms reconverge at release. (`dissent` is no longer a node: it is a field of
# the release manifest, validated by `release` itself.)
[[spore.edge]]
from = "converge"
to   = "release"
type = "feeds"

[[spore.edge]]
from = "rehearsal"
to   = "release"
type = "verifies"

# The THIRD arm into release: the author-independent install route, which descends
# from nothing and therefore appears in the edge list exactly once — here. It gates
# `release` and NOT `converge`, so its deviations cannot be answered in the
# convergence's on-ballot / off-ballot vocabulary.
[[spore.edge]]
from = "route"
to   = "release"
type = "verifies"

# release -> confirm SURVIVES as ORDERING ONLY (you cannot replay a candidate that
# does not exist). `release` PASS is the terminal success state CANDIDATE-LANDED;
# `confirm` flips it to CLOSED asynchronously and nothing waits on it. `feeds`, not
# `verifies`: the candidate is what flows to the reporter, and the old label said the
# release was pending G11's verification, which is the serialization that was removed.
[[spore.edge]]
from = "release"
to   = "confirm"
type = "feeds"
