\* #129 counterexample: a lifecycle or tag writer lands after model selection.
\* The old commit uses the claim snapshot and replaces that writer's state.
\* Expected: NoWriterOverwritten fails after ConcurrentWrite -> SpawnBy.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Mol = {m1}
    MaxSeqno = 1
    AsyncCrashesEnabled = FALSE
    OutOfBandEnabled    = FALSE
    T_STALL  = 99
    MaxClock = 1
    ConcurrencyEnabled = TRUE
    BlockedBy = {}
    PreFix    = {"StaleDispatchCommit"}
INVARIANTS
    NoWriterOverwritten
