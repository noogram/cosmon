requires_parent_link = true
acceptance = "MOLECULE_DIR/dag.md written enumerating every nucleated seat (generator if needed, each refuter as a cmb-verify molecule, and the collector) with role, resolved family, DISTINCT `role_id`, injected adversarial-briefing `contract_hash`, the `--adapter` the PILOT will tackle it under, and typed edges. Each seat's adversarial contract was written to its own `committee-posture.md` via `render_committee_posture` — NEVER pasted inline into briefing.md, which `cs evolve` clobbers. No `--refutes` edge was filed unless the mechanism was already refuted by a static read before dispatch (cmb-verify owns that edge and forbids it before a REFUTED verdict). No seat was tackled by this orchestrator — tackle is the pilot's gesture, handed over in handoff.md. roster.json was rewritten with the seats' REAL molecule ids and each seat's `adapter`, and `cs reconcile --check` is now clean on every DISPATCH-INDEPENDENT axis — resolution, self-attestation, both collisions, the family floor, and any `claims injected: true` divergence. `injected` was NOT hand-set: the gate derives it from the seats' own files. The remaining `briefing-not-injected` lines are expected here (the pointer into briefing.md is written by the dispatch verbs — `cs tackle`, `cs evolve`, `cs complete` — and this step runs none of them) and handoff.md carries the FULLY-GREEN bar as the pilot's post-tackle check, where the actor who runs it can satisfy it. Each child was tagged `temp:warm`. The seat count matches the convened roster (the Tier-1 `count` measure). Refuter families are DISTINCT from the generator on the resolved endpoint (witness 1) AND carry distinct personas with injected briefings and a falsification artefact (witness 2)."

[[steps]]
id = "handoff"
title = "Hand the DAG to the pilot and record the aggregation rule + return-citation"
description = """
The committee is a DAG the pilot runs; this orchestrator's job ends at \
a clean hand-off. Do NOT tackle or wait on the seats — that is the \
pilot's role (`cs tackle` / `cs run` are human-only; the worker/human \
boundary is non-negotiable). The `dispatch-seats` step above agrees: it \
nucleates and tags, and records each seat's intended `--adapter` in \
dag.md for you to hand over here. (It used to ORDER `cs tackle <seat> \
--adapter <family>` two steps before this sentence forbade it. An \
orchestrator following the recipe literally either violated the \
boundary or stalled waiting on its own children, depending on which \
half it read last.)

Write MOLECULE_DIR/handoff.md:
  1. The exact pilot commands to run the committee — either \
     `cs tackle <seat> --adapter <family>` per seat (each under its \
     DISTINCT resolved family, Path A) then `cs done` in dependency \
     order, or a single `cs run <root>` if the seats' adapters are \
     pinned. Name the `--adapter` for every seat explicitly so a \
     later reader cannot accidentally collapse the jury to one family.
  2. THE FULLY-GREEN GATE, which is YOURS and not the orchestrator's. \
     Immediately after the LAST `cs tackle` and before reading any \
     seat's verdict, run `cs reconcile --check` and require it FULLY \
     GREEN on the roster lint. The committee may not be aggregated \
     until it is. This bar lives here, not in `dispatch-seats`, for a \
     measured reason: witness (2)'s delivery test needs the briefing.md \
     pointer, and `cs tackle` is what writes it — the orchestrator is \
     forbidden from running tackle, so demanding fully-green there was \
     a gate assigned to an actor who could not satisfy it (measured on \
     committee-20260728-f744: durable posture file written, real ids in \
     the roster, check still exited 1). A red line HERE names a seat \
     that may not sit and whose verdict may not be counted. Never \
     hand-edit roster.json to clear it: `injected` is derived from \
     files, and the resolution and self-attestation lines are about \
     `[adapters]`, not about the roster's prose. Record the command's \
     exit code and output verbatim in handoff.md.
  3. The CONJUNCTIVE decision rule restated for the record: committee \
     `refuted` if ANY refuter refuted or any falsifier went red; \
     `confirmed` only if EVERY seat confirmed; else `inconclusive`. \
     A verdict-door, never a majority vote. \
     NAME THE TWO VOCABULARIES AND THEIR MAPPING, because a seat sits \
     in both at once: cmb-verify's own door is \
     {confirmed | refuted | inconclusive} in verdict.json, while a seat \
     convened inside a converge loop ALSO writes \
     {CLEAN | FINDINGS | INCONCLUSIVE} on referee-report.md's first \
     line. THE CORRESPONDENCE IS RELATIVE TO THE SEAT'S \
     `mechanism_polarity`, and a seat this formula convenes is always \
     `polarity: fix` — it audits the generator's shipped fix, so \
     confirmed↔CLEAN, refuted↔FINDINGS, inconclusive↔INCONCLUSIVE, and \
     one seat emitting `VERDICT: FINDINGS (2)` and `REFUTED` together \
     is agreement, not contradiction. Do NOT copy that correspondence \
     anywhere it might be read for a `polarity: defect` molecule, where \
     it inverts (confirmed = the defect reproduces = FINDINGS); the \
     definition, with both rows, is `cmb-verify.formula.toml` step \
