     `claims injected: true` divergence. `briefing-not-injected` lines \
     are STILL EXPECTED here and are NOT a failure of this step: the \
     briefing.md pointer is written by the dispatch verbs (`cs tackle`, \
     `cs evolve`, `cs complete`), and this step is forbidden from \
     running any of them. Demanding fully-green here \
     assigns the orchestrator a bar only the pilot's next gesture can \
     clear — measured on committee-20260728-f744, where the durable \
     posture file was written, the real ids were in the roster, and the \
     check still exited 1. The FULLY-GREEN bar therefore lives in \
     handoff.md as the pilot's POST-TACKLE check, where the actor who \
